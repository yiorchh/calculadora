<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calculadora científica</title>
<style>
  :root {
    --bg: #e6e6e6;
    --key: #ffffff;
    --line: #9a9a9a;
    --ink: #111;
    --screen: #dfe8d6;
    --shift: #d9730d;
    --alpha: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .calc {
    max-width: 420px;
    margin: 0 auto;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .screen {
    background: var(--screen);
    border: 2px solid #777;
    border-radius: 8px;
    padding: 8px 12px 10px;
    min-height: 124px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    overflow: hidden;
  }
  .ind { font-size: 12px; min-height: 16px; color: #333; }
  .expr {
    font-size: 17px;
    min-height: 24px;
    word-break: break-all;
    white-space: pre-wrap;
  }
  .res {
    font-size: 30px;
    min-height: 40px;
    text-align: right;
    word-break: break-all;
  }
  .caret {
    display: inline-block;
    width: 2px;
    height: 18px;
    background: var(--ink);
    vertical-align: middle;
  }
  .keys { display: grid; gap: 6px; margin-top: 8px; }
  .six { grid-template-columns: repeat(6, 1fr); }
  .five { grid-template-columns: repeat(5, 1fr); }
  .top { margin-top: 12px; }
  button {
    position: relative;
    min-width: 0;
    height: 50px;
    padding: 0;
    background: var(--key);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { background: #ddd; }
  button.on { background: #cfcfcf; }
  button i {
    position: absolute;
    font-style: normal;
    font-size: 9px;
    line-height: 1;
    white-space: nowrap;
  }
  button i.s { top: 4px; left: 5px; color: var(--shift); }
  button i.a { top: 4px; right: 5px; color: var(--alpha); }
  button b { font-weight: 500; }
  [hidden] { display: none !important; }

  /* Pestañas CALCULADORA / EQUATIONS */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .tabs button { height: 36px; font-size: 13px; letter-spacing: .04em; }
  .tabs button.on { background: #cfcfcf; font-weight: 600; }

  /* EQUATIONS */
  #viewEq button { height: 40px; font-size: 14px; }
  #viewEq input {
    width: 100%;
    height: 40px;
    padding: 0 10px;
    font: inherit;
    font-size: 16px;   /* evita el zoom automático de iOS al enfocar */
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--key);
    color: var(--ink);
  }
  #viewEq input.bad { border-color: var(--alpha); }
  #eqSearch { margin-bottom: 8px; }
  .eq-list { display: grid; gap: 6px; }
  .eq-item { height: auto !important; padding: 8px 10px; text-align: left; display: grid; gap: 2px; }
  .eq-item span { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eq-item small { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: #555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eq-empty { background: var(--key); border: 1px dashed var(--line); border-radius: 8px; padding: 14px; font-size: 14px; color: #333; text-align: center; display: grid; gap: 10px; }
  #eqNew { width: 100%; margin-top: 8px; }
  #eqBack { height: 34px !important; font-size: 13px !important; padding: 0 12px !important; }
  .lbl { font-size: 12px; color: #444; margin: 10px 0 4px; }
  .box {
    background: var(--key);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    min-height: 40px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 16px;
    word-break: break-all;
  }
  .box.res { text-align: right; font-size: 22px; min-height: 48px; }
  .box.hint { font-family: inherit; font-size: 14px; color: #555; }
  .box.err { font-family: inherit; font-size: 14px; color: var(--alpha); }
  .eq-orig { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: #555; margin-top: 4px; min-height: 14px; word-break: break-all; }
  .vars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .vars label { display: grid; gap: 3px; font-size: 13px; }
  .vars label span { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
  .msg { font-size: 13px; min-height: 18px; margin-top: 8px; color: #333; }
  .kb { display: grid; gap: 4px; margin-top: 10px; }
  .kb-row { display: flex; justify-content: center; gap: 4px; }
  .kb-row button { flex: 0 0 calc(10% - 4px); height: 38px; padding: 0; font-size: 14px; }
  .kb-ops { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  #eqKb button { height: 38px; }
  #eqKb button.on { background: #cfcfcf; }

  @media (max-width: 359px) {
    button { font-size: 12px; height: 46px; }
  }
</style>
</head>
<body>
<div class="calc" id="calc">
  <nav class="tabs">
    <button type="button" data-view="calc" class="on">CALCULADORA</button>
    <button type="button" data-view="eq">EQUATIONS</button>
  </nav>

  <div id="viewCalc">
  <div class="screen">
    <div class="ind" id="ind"></div>
    <div class="expr" id="expr"></div>
    <div class="res" id="res"></div>
  </div>

  <div class="keys six top" id="top"></div>
  <div class="keys six" id="sci"></div>
  <div class="keys five" id="num"></div>
  </div>

  <section id="viewEq" hidden>
    <div id="eqListBox">
      <input id="eqSearch" type="search" placeholder="Buscar por nombre" autocomplete="off">
      <div id="eqList" class="eq-list"></div>
      <button type="button" id="eqNew">+ Nueva ecuación</button>
    </div>

    <div id="eqEditor" hidden>
      <div><button type="button" id="eqBack">← Ecuaciones</button></div>
      <div class="lbl">Nombre</div>
      <input id="eqName" type="text" maxlength="80" placeholder="Ej. Distribución hipergeométrica" autocomplete="off">
      <div class="lbl">Expresión</div>
      <div class="box" id="eqExpr"></div>
      <div class="eq-orig" id="eqOrig"></div>
      <div class="lbl">Valores</div>
      <div class="vars" id="eqVars"></div>
      <div class="lbl">Resultado</div>
      <div class="box res" id="eqResult"></div>
      <div class="actions">
        <button type="button" id="eqCalc">Calcular</button>
        <button type="button" id="eqEdit">Editar</button>
        <button type="button" id="eqSave">Guardar cambios</button>
        <button type="button" id="eqCancel">Cancelar</button>
        <button type="button" id="eqDup">Duplicar</button>
        <button type="button" id="eqDel">Eliminar</button>
      </div>
      <div class="msg" id="eqMsg"></div>
      <div class="kb" id="eqKb" hidden></div>
    </div>
  </section>
</div>

<script>
(() => {
  // ---------- Estado ----------
  let tokens = [];          // expresión como lista de tokens
  let cursor = 0;           // posición del cursor (REPLAY ◄ ►)
  let result = '';          // último resultado mostrado
  let error = '';           // mensaje de error
  let lastAns = 0;          // Ans
  let justEval = false;     // true tras pulsar '='
  let shift = false, alpha = false;
  let hypP = false, stoP = false, rclP = false, modeP = false;
  let mode = 'COMP';        // COMP | SD
  let angle = 'DEG';        // DEG | RAD | GRA
  let stats = [];           // datos estadísticos (modo SD)
  const mem = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, X: 0, Y: 0, M: 0 };

  const OPS = new Set(['+', '-', '*', '/', '^', 'xroot', 'nCr', 'nPr', '!', 'sq', 'cu', 'inv', '%', ')', ',']);
  const DISP = {
    NEG: '−', '*': '×', '/': '÷', sqrt: '√', cbrt: '³√', sq: '²', cu: '³', inv: '⁻¹',
    pow10: '10ˣ', exp: 'eˣ', asin: 'sin⁻¹', acos: 'cos⁻¹', atan: 'tan⁻¹',
    asinh: 'sinh⁻¹', acosh: 'cosh⁻¹', atanh: 'tanh⁻¹', EXP: 'EXP', EULER: 'e', PI: 'π',
    ANS: 'Ans', RAN: 'Ran#', N: 'n', SUMX: 'Σx', SUMX2: 'Σx²', MEAN: 'x̄', SDP: 'xσn',
    SDS: 'xσn-1', xroot: 'ˣ√', nCr: 'nCr', nPr: 'nPr', Pol: 'Pol', Rec: 'Rec'
  };
  const MODES = {
    d1: ['mode', 'COMP'], d2: ['mode', 'SD'],
    d3: ['angle', 'DEG'], d4: ['angle', 'RAD'], d5: ['angle', 'GRA']
  };

  // ---------- Errores y utilidades ----------
  const syn = () => { throw new Error('Syntax ERROR'); };
  const math = () => { throw new Error('Math ERROR'); };
  const noop = () => {};
  const toRad = x => angle === 'DEG' ? x * Math.PI / 180 : angle === 'GRA' ? x * Math.PI / 200 : x;
  const fromRad = x => angle === 'DEG' ? x * 180 / Math.PI : angle === 'GRA' ? x * 200 / Math.PI : x;

  const fact = n => {
    if (!Number.isInteger(n) || n < 0 || n > 170) math();
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  };
  const comb = (n, r) => {
    if (!Number.isInteger(n) || !Number.isInteger(r) || r < 0 || r > n) math();
    return Math.round(fact(n) / (fact(r) * fact(n - r)));
  };
  const perm = (n, r) => {
    if (!Number.isInteger(n) || !Number.isInteger(r) || r < 0 || r > n) math();
    return Math.round(fact(n) / fact(n - r));
  };
  const pol = (x, y) => { mem.Y = fromRad(Math.atan2(y, x)); return Math.hypot(x, y); };
  const rec = (r, t) => { const a = toRad(t); mem.Y = r * Math.sin(a); return r * Math.cos(a); };

  const FUNCS = {
    sin: x => Math.sin(toRad(x)), cos: x => Math.cos(toRad(x)), tan: x => Math.tan(toRad(x)),
    asin: x => fromRad(Math.asin(x)), acos: x => fromRad(Math.acos(x)), atan: x => fromRad(Math.atan(x)),
    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
    asinh: Math.asinh, acosh: Math.acosh, atanh: Math.atanh,
    log: Math.log10, ln: Math.log, sqrt: Math.sqrt, cbrt: Math.cbrt,
    exp: Math.exp, pow10: x => 10 ** x
  };

  const sum = a => a.reduce((s, x) => s + x, 0);
  const mean = () => { if (!stats.length) math(); return sum(stats) / stats.length; };
  const sdev = k => {
    const n = stats.length;
    if (n <= k) math();
    const m = mean();
    return Math.sqrt(stats.reduce((s, x) => s + (x - m) ** 2, 0) / (n - k));
  };

  // ---------- Parser (descenso recursivo) ----------
  let tks = [], pos = 0;
  const peek = () => tks[pos];
  const expect = t => { if (peek() !== t) syn(); pos++; };
  const isDigit = t => /^[0-9.]$/.test(t || '');
  const VARS = ['PI', 'EULER', 'ANS', 'RAN', 'N', 'SUMX', 'SUMX2', 'MEAN', 'SDP', 'SDS', 'A', 'B', 'C', 'D', 'E', 'F', 'X', 'Y', 'M'];
  const startsPrimary = t => t !== undefined && (isDigit(t) || t === '(' || t === 'Pol' || t === 'Rec' || t in FUNCS || VARS.includes(t));

  function parseExpr() {
    let v = parseTerm();
    for (;;) {
      const t = peek();
      if (t === '+') { pos++; v += parseTerm(); }
      else if (t === '-') { pos++; v -= parseTerm(); }
      else return v;
    }
  }

  function parseTerm() {
    let v = parseUnary();
    for (;;) {
      const t = peek();
      if (t === '*') { pos++; v *= parseUnary(); }
      else if (t === '/') { pos++; v /= parseUnary(); }
      else if (startsPrimary(t)) { v *= parseUnary(); } // multiplicación implícita: 2π, 3(4)
      else return v;
    }
  }

  function parseUnary() {
    const t = peek();
    if (t === 'NEG' || t === '-') { pos++; return -parseUnary(); }
    if (t === '+') { pos++; return parseUnary(); }
    return parsePower();
  }

  function parsePower() {
    let v = parsePostfix();
    for (;;) {
      const t = peek();
      if (t === '^') { pos++; v = v ** parseUnary(); }
      else if (t === 'xroot') { pos++; const b = parseUnary(); v = b ** (1 / v); }
      else if (t === 'nCr') { pos++; v = comb(v, parseUnary()); }
      else if (t === 'nPr') { pos++; v = perm(v, parseUnary()); }
      else return v;
    }
  }

  function parsePostfix() {
    let v = parsePrimary();
    for (;;) {
      const t = peek();
      if (t === '!') { pos++; v = fact(v); }
      else if (t === 'sq') { pos++; v *= v; }
      else if (t === 'cu') { pos++; v **= 3; }
      else if (t === 'inv') { pos++; v = 1 / v; }
      else if (t === '%') { pos++; v /= 100; }
      else return v;
    }
  }

  function parsePrimary() {
    const t = peek();
    if (t === undefined) syn();

    if (isDigit(t)) {
      let s = '';
      while (isDigit(peek())) s += tks[pos++];
      if (peek() === 'EXP') {
        pos++;
        let sign = '';
        if (peek() === 'NEG' || peek() === '-') { sign = '-'; pos++; }
        let e = '';
        while (/^[0-9]$/.test(peek() || '')) e += tks[pos++];
        if (!e) syn();
        s += 'e' + sign + e;
      }
      if (!/\d/.test(s.split('e')[0]) || (s.match(/\./g) || []).length > 1) syn();
      return parseFloat(s);
    }

    if (t === '(') { pos++; const v = parseExpr(); expect(')'); return v; }

    if (t in FUNCS) {
      pos++; expect('('); const v = parseExpr(); expect(')');
      return FUNCS[t](v);
    }

    if (t === 'Pol' || t === 'Rec') {
      pos++; expect('('); const a = parseExpr(); expect(','); const b = parseExpr(); expect(')');
      return t === 'Pol' ? pol(a, b) : rec(a, b);
    }

    pos++;
    switch (t) {
      case 'PI': return Math.PI;
      case 'EULER': return Math.E;
      case 'ANS': return lastAns;
      case 'RAN': return Math.random();
      case 'N': return stats.length;
      case 'SUMX': return sum(stats);
      case 'SUMX2': return sum(stats.map(x => x * x));
      case 'MEAN': return mean();
      case 'SDP': return sdev(0);
      case 'SDS': return sdev(1);
      default:
        if (t in mem) return mem[t];
        syn();
    }
  }

  function evaluate(list) {
    tks = list.slice();
    let open = 0;
    for (const t of tks) { if (t === '(') open++; else if (t === ')') open--; }
    while (open-- > 0) tks.push(')');   // cierre automático de paréntesis
    pos = 0;
    const v = parseExpr();
    if (pos !== tks.length) syn();
    if (!Number.isFinite(v)) math();
    return v;
  }

  const evalTokens = () => tokens.length ? evaluate(tokens) : lastAns;

  // ---------- Formato del resultado ----------
  function fmt(v) {
    if (v === 0) return '0';
    const a = Math.abs(v);
    if (a >= 1e10 || a < 1e-6) {
      return v.toExponential(9).replace(/\.?0+e/, 'e').replace('e', 'E');
    }
    return String(parseFloat(v.toPrecision(10)));
  }

  // ---------- Edición de la expresión ----------
  function ins(...t) {
    if (justEval) {
      tokens = OPS.has(t[0]) ? ['ANS'] : [];
      cursor = tokens.length;
      justEval = false;
    }
    tokens.splice(cursor, 0, ...t);
    cursor += t.length;
    error = '';
  }

  function del() {
    if (justEval) { tokens = []; cursor = 0; result = ''; justEval = false; return; }
    if (cursor > 0) { tokens.splice(cursor - 1, 1); cursor--; }
    error = '';
  }

  function clearAll() {
    tokens = []; cursor = 0; result = ''; error = '';
    justEval = false;
    stoP = rclP = modeP = hypP = false;
    shift = alpha = false;
  }

  function evalNow() {
    try {
      const v = evalTokens();
      lastAns = v;
      result = fmt(v);
      error = '';
      justEval = true;
      cursor = tokens.length;
    } catch (e) {
      error = e.message; result = ''; justEval = false;
    }
  }

  function storeVar(name) {
    try {
      const v = evalTokens();
      mem[name] = v;
      tokens = []; cursor = 0;
      result = fmt(v); error = ''; justEval = true;
    } catch (e) { error = e.message; }
  }

  function memOp(sign) {
    if (mode === 'SD' && sign < 0) { stats.pop(); return; }
    try {
      const v = evalTokens();
      if (mode === 'SD') stats.push(v); else mem.M += sign * v;
      tokens = []; cursor = 0;
      result = fmt(v); error = ''; justEval = true;
    } catch (e) { error = e.message; }
  }

  function trig(name) {
    let n = name;
    if (hypP) { n = name.replace(/^(a?)(sin|cos|tan)$/, '$1$2h'); hypP = false; }
    ins(n, '(');
  }

  // ---------- Teclas ----------
  const K = {};
  const def = (id, o) => { K[id] = o; };

  for (let d = 0; d <= 9; d++) def('d' + d, { l: String(d), m: () => ins(String(d)) });
  def('d7', { l: '7', s: 'n', m: () => ins('7'), sh: () => ins('N') });
  def('d8', { l: '8', s: 'Σx', m: () => ins('8'), sh: () => ins('SUMX') });
  def('d9', { l: '9', s: 'Σx²', m: () => ins('9'), sh: () => ins('SUMX2') });
  def('d1', { l: '1', s: 'x̄', m: () => ins('1'), sh: () => ins('MEAN') });
  def('d2', { l: '2', s: 'xσn', m: () => ins('2'), sh: () => ins('SDP') });
  def('d3', { l: '3', s: 'xσn-1', m: () => ins('3'), sh: () => ins('SDS') });
  def('d0', { l: '0', s: 'Rnd', m: () => ins('0'), sh: noop });

  def('inv', { l: 'x⁻¹', s: 'x!', m: () => ins('inv'), sh: () => ins('!') });
  def('ncr', { l: 'nCr', s: 'nPr', m: () => ins('nCr'), sh: () => ins('nPr') });
  def('pol', { l: 'Pol(', s: 'Rec(', m: () => ins('Pol', '('), sh: () => ins('Rec', '(') });
  def('cbrt', { l: '³√', m: () => ins('cbrt', '(') });
  def('cu', { l: 'x³', m: () => ins('cu') });
  def('pow', { l: 'xʸ', s: 'ˣ√', m: () => ins('^'), sh: () => ins('xroot') });

  def('eng', { l: 'ENG', m: noop });
  def('abc', { l: 'a b/c', s: 'd/c', m: noop });
  def('sqrt', { l: '√', m: () => ins('sqrt', '(') });
  def('sq', { l: 'x²', m: () => ins('sq') });
  def('log', { l: 'log', s: '10ˣ', m: () => ins('log', '('), sh: () => ins('pow10', '(') });
  def('ln', { l: 'ln', s: 'eˣ', m: () => ins('ln', '('), sh: () => ins('exp', '(') });

  def('neg', { l: '(−)', v: 'A', m: () => ins('NEG') });
  def('deg', { l: '°′″', v: 'B', m: noop });
  def('hyp', { l: 'hyp', v: 'C', m: () => { hypP = true; } });
  def('sin', { l: 'sin', s: 'sin⁻¹', v: 'D', m: () => trig('sin'), sh: () => trig('asin') });
  def('cos', { l: 'cos', s: 'cos⁻¹', v: 'E', m: () => trig('cos'), sh: () => trig('acos') });
  def('tan', { l: 'tan', s: 'tan⁻¹', v: 'F', m: () => trig('tan'), sh: () => trig('atan') });

  def('sto', { l: 'STO', m: () => { stoP = true; } });
  def('rcl', { l: 'RCL', m: () => { rclP = true; } });
  def('lp', { l: '(', m: () => ins('(') });
  def('rp', { l: ')', v: 'X', m: () => ins(')') });
  def('comma', { l: ',', v: 'Y', m: () => ins(',') });
  def('mplus', { l: 'M+', s: 'M−', v: 'M', m: () => memOp(1), sh: () => memOp(-1) });

  def('del', { l: 'DEL', s: 'INS', m: del, sh: noop });
  def('ac', { l: 'AC', s: 'Mcl', m: clearAll, sh: () => { stats = []; } });
  def('eq', { l: '=', s: '%', m: evalNow, sh: () => ins('%') });

  def('add', { l: '+', m: () => ins('+') });
  def('sub', { l: '−', m: () => ins('-') });
  def('mul', { l: '×', m: () => ins('*') });
  def('div', { l: '÷', m: () => ins('/') });
  def('dot', { l: '.', s: 'Ran#', m: () => ins('.'), sh: () => ins('RAN') });
  def('exp', { l: 'EXP', s: 'π', m: () => ins('EXP'), sh: () => ins('PI') });
  def('ans', { l: 'Ans', s: 'DRG▶', m: () => ins('ANS'), sh: noop });

  def('left', { l: '◄', m: () => { cursor = Math.max(0, cursor - 1); } });
  def('right', { l: '►', m: () => { cursor = Math.min(tokens.length, cursor + 1); } });
  def('mode', { l: 'MODE', m: () => { modeP = true; } });
  def('on', { l: 'ON', m: clearAll });
  def('shift', { l: 'SHIFT' });
  def('alpha', { l: 'ALPHA' });

  // ---------- Despacho de pulsaciones ----------
  const TRIG_IDS = ['sin', 'cos', 'tan'];

  function handle(id) {
    const k = K[id];
    if (!k) return;

    if (id === 'shift') { shift = !shift; alpha = false; return; }
    if (id === 'alpha') { alpha = !alpha; shift = false; return; }

    if (modeP) {
      modeP = false;
      const m = MODES[id];
      if (m) { if (m[0] === 'mode') mode = m[1]; else angle = m[1]; }
      return;
    }

    // STO/RCL seguido de ALPHA + variable
    if ((stoP || rclP) && alpha && k.v) {
      alpha = false; shift = false;
      if (stoP) { stoP = false; storeVar(k.v); }
      else { rclP = false; ins(k.v); }
      return;
    }
    stoP = rclP = false;

    if (!TRIG_IDS.includes(id) && id !== 'hyp') hypP = false;

    const useShift = shift, useAlpha = alpha;
    shift = alpha = false;

    if (useShift) (k.sh || noop)();
    else if (useAlpha) (k.v ? () => ins(k.v) : noop)();
    else (k.m || noop)();
  }

  function press(id) {
    handle(id);
    render();
  }

  // ---------- Pantalla ----------
  const $ = id => document.getElementById(id);

  function render() {
    $('expr').innerHTML = tokens.map((t, i) =>
      (i === cursor ? '<span class="caret"></span>' : '') + (DISP[t] || t)
    ).join('') + (cursor === tokens.length ? '<span class="caret"></span>' : '');

    $('res').textContent = error || result;

    $('ind').textContent = [
      shift ? 'SHIFT' : '', alpha ? 'ALPHA' : '', hypP ? 'HYP' : '',
      stoP ? 'STO' : '', rclP ? 'RCL' : '', modeP ? 'MODE?' : '',
      mode, angle
    ].filter(Boolean).join(' · ');

    document.querySelector('[data-k="shift"]').classList.toggle('on', shift);
    document.querySelector('[data-k="alpha"]').classList.toggle('on', alpha);
  }

  // ---------- Construcción del teclado ----------
  const LAYOUT = {
    top: [['shift', 'alpha', 'left', 'right', 'mode', 'on']],
    sci: [
      ['inv', 'ncr', 'pol', 'cbrt', 'cu', 'pow'],
      ['eng', 'abc', 'sqrt', 'sq', 'log', 'ln'],
      ['neg', 'deg', 'hyp', 'sin', 'cos', 'tan'],
      ['sto', 'rcl', 'lp', 'rp', 'comma', 'mplus']
    ],
    num: [
      ['d7', 'd8', 'd9', 'del', 'ac'],
      ['d4', 'd5', 'd6', 'mul', 'div'],
      ['d1', 'd2', 'd3', 'add', 'sub'],
      ['d0', 'dot', 'exp', 'ans', 'eq']
    ]
  };

  const btn = id => {
    const k = K[id];
    return `<button type="button" data-k="${id}">` +
      (k.s ? `<i class="s">${k.s}</i>` : '') +
      `<b>${k.l}</b>` +
      (k.v ? `<i class="a">${k.v}</i>` : '') +
      `</button>`;
  };

  for (const [box, rows] of Object.entries(LAYOUT)) {
    const el = $(box);
    el.innerHTML = rows.flat().map(btn).join('');
  }

  // Delegación de clics: cada botón lleva su id en data-k
  $('viewCalc').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) press(b.dataset.k);
  });

  const KEYMAP = {
    '+': 'add', '-': 'sub', '*': 'mul', '/': 'div', '.': 'dot',
    '(': 'lp', ')': 'rp', ',': 'comma', '^': 'pow',
    Enter: 'eq', '=': 'eq', Backspace: 'del', Delete: 'del', Escape: 'ac',
    ArrowLeft: 'left', ArrowRight: 'right'
  };
  window.addEventListener('keydown', e => {
    if (view !== 'calc' || e.ctrlKey || e.metaKey || e.altKey) return;
    const id = /^[0-9]$/.test(e.key) ? 'd' + e.key : KEYMAP[e.key];
    if (!id) return;
    e.preventDefault();
    press(id);
  });

  // ================= EQUATIONS =================
  let view = 'calc';
  const STORE_KEY = 'calc.equations.v1';
  const CONSTS = { 'π': Math.PI, e: Math.E };          // constantes: valor inicial editable
  const FN_NAMES = ['asinh', 'acosh', 'atanh', 'asin', 'acos', 'atan', 'sinh', 'cosh', 'tanh',
    'sin', 'cos', 'tan', 'log', 'ln', 'sqrt', 'cbrt', 'exp'];
  const NUM_RE = /^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i;
  const EQ_DIGITS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
  const EQ_LETTERS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
  const EQ_OPS = [
    ['(', '('], [')', ')'], [',', ','], ['!', '!'], ['^', '^'], ['π', 'π'],
    ['sin', 'sin('], ['cos', 'cos('], ['tan', 'tan('], ['√', 'sqrt('], ['ln', 'ln('], ['log', 'log('],
    ['nCr', ' nCr '], ['nPr', ' nPr '], ['e', 'e'], ['+', '+'], ['−', '-'], ['×', '*'],
    ['÷', '/'], ['.', '.']
  ];
  const EQ_CHAR_RE = /^[A-Za-z0-9.+\-*/^()!,]$/;

  const eq = { open: false, id: null, name: '', expr: '', saved: null, editing: false, cursor: 0, values: {} };
  let cur = { tree: null, err: '', vars: [] };   // análisis de la expresión de trabajo
  let kbLower = false;

  // ---------- Almacenamiento ----------
  const normName = s => s.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const sameName = (a, b) => normName(a) === normName(b);
  const newId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : 'eq-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function loadEquations() {
    try {
      const data = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
      return Array.isArray(data)
        ? data.filter(x => x && typeof x.id === 'string' && typeof x.name === 'string' && typeof x.expr === 'string')
        : [];
    } catch (err) { return []; }
  }
  // Convierte la notación antigua C(n,r) / P(n,r) de ecuaciones guardadas a n nCr r / n nPr r
  function migrateExpr(s) {
    const step = t => t.replace(/(^|[^A-Za-z])([CP])\(([^(),]*),([^()]*)\)/g,
      (m, pre, f, a, b) => `${pre}(${a.trim()}) ${f === 'C' ? 'nCr' : 'nPr'} (${b.trim()})`);
    let out = s;
    let next = step(out);
    while (next !== out) { out = next; next = step(out); }
    return out;
  }
  let equations = loadEquations().map(x => ({ ...x, expr: migrateExpr(x.expr) }));
  let storageOk = true;
  function persist() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(equations)); storageOk = true; }
    catch (err) { storageOk = false; }
  }

  // ---------- Tokenizador ----------
  const bad = msg => { throw new Error(msg); };
  const isNat = x => Number.isInteger(x) && x >= 0;

  function tokenize(src) {
    const out = [];
    let i = 0;
    while (i < src.length) {
      const ch = src[i];
      if (ch === ' ') { i++; continue; }
      if (/[0-9.]/.test(ch)) {
        const m = /^(\d+\.?\d*|\.\d+)/.exec(src.slice(i));
        if (!m || src[i + m[1].length] === '.') bad('Número mal formado');
        out.push({ t: 'num', v: parseFloat(m[1]) });
        i += m[1].length;
        continue;
      }
      if (src.startsWith('nCr', i) || src.startsWith('nPr', i)) {
        out.push({ t: 'op', v: src.slice(i, i + 3) });   // operador infijo, como la tecla nCr/nPr
        i += 3;
        continue;
      }
      if (/[A-Za-zπ]/.test(ch)) {
        const fn = FN_NAMES.find(n => src.startsWith(n, i) && src[i + n.length] === '(');
        if (fn) { out.push({ t: 'fn', n: fn }); i += fn.length; continue; }
        // Una letra es variable (distingue mayúsculas); 'e' minúscula y 'π' son constantes
        out.push({ t: ch === 'e' || ch === 'π' ? 'const' : 'var', n: ch });
        i++;
        continue;
      }
      if (!'+-*/^(),!'.includes(ch)) bad('Carácter no válido: ' + ch);
      out.push({ t: 'op', v: ch });
      i++;
    }
    return out;
  }

  // ---------- Analizador sintáctico → árbol (sin ejecutar código) ----------
  function parseEq(src) {
    const toks = tokenize(src);
    if (!toks.length) bad('Escribe una expresión.');
    let p = 0;
    const at = () => toks[p];
    const isOp = v => !!at() && at().t === 'op' && at().v === v;
    const expect = v => { if (!isOp(v)) bad('Expresión mal formada'); p++; };
    const startsPrimary = tk => !!tk && (tk.t === 'num' || tk.t === 'var' || tk.t === 'const' || tk.t === 'fn' || (tk.t === 'op' && tk.v === '('));

    function expr() {
      let n = term();
      while (isOp('+') || isOp('-')) { const op = toks[p++].v; n = { t: 'bin', op, a: n, b: term() }; }
      return n;
    }
    function term() {
      let n = unary();
      for (;;) {
        if (isOp('*') || isOp('/')) { const op = toks[p++].v; n = { t: 'bin', op, a: n, b: unary() }; }
        else if (startsPrimary(at())) { n = { t: 'bin', op: '*', a: n, b: unary() }; }  // 2π, 3(4), 2x
        else return n;
      }
    }
    function unary() {
      if (isOp('-')) { p++; return { t: 'neg', a: unary() }; }
      if (isOp('+')) { p++; return unary(); }
      return power();
    }
    function power() {
      let base = postfix();
      while (isOp('nCr') || isOp('nPr')) { const op = toks[p++].v; base = { t: 'bin', op, a: base, b: postfix() }; }
      if (isOp('^')) { p++; return { t: 'bin', op: '^', a: base, b: unary() }; }
      return base;
    }
    function postfix() {
      let n = primary();
      while (isOp('!')) { p++; n = { t: 'fact', a: n }; }
      return n;
    }
    function primary() {
      const tk = at();
      if (!tk) bad('Expresión mal formada');
      if (tk.t === 'num') { p++; return { t: 'num', v: tk.v }; }
      if (tk.t === 'var' || tk.t === 'const') { p++; return { t: tk.t, n: tk.n }; }
      if (tk.t === 'fn') {
        p++;
        expect('(');
        const arg = expr();
        expect(')');
        return { t: 'fn', n: tk.n, args: [arg] };
      }
      if (isOp('(')) { p++; const n = expr(); expect(')'); return n; }
      bad('Expresión mal formada');
    }
    const tree = expr();
    if (p !== toks.length) bad('Expresión mal formada');
    return tree;
  }

  function collectVars(node, out = []) {
    if (node.t === 'var' || node.t === 'const') { if (!out.includes(node.n)) out.push(node.n); }
    else if (node.t === 'bin') { collectVars(node.a, out); collectVars(node.b, out); }
    else if (node.t === 'neg' || node.t === 'fact') collectVars(node.a, out);
    else if (node.t === 'fn') node.args.forEach(a => collectVars(a, out));
    return out;
  }

  // ---------- Evaluación del árbol con valores numéricos ----------
  function evalTree(node, env) {
    switch (node.t) {
      case 'num': return node.v;
      case 'var':
      case 'const': {
        const v = env[node.n];
        if (v === undefined) bad('Falta valor de ' + node.n);
        return v;
      }
      case 'neg': return -evalTree(node.a, env);
      case 'fact': {
        const n = evalTree(node.a, env);
        if (!isNat(n) || n > 170) bad('Factorial solo admite enteros de 0 a 170');
        return fact(n);
      }
      case 'bin': {
        const a = evalTree(node.a, env);
        const b = evalTree(node.b, env);
        if (node.op === '+') return a + b;
        if (node.op === '-') return a - b;
        if (node.op === '*') return a * b;
        if (node.op === '/') { if (b === 0) bad('División por cero'); return a / b; }
        if (node.op === 'nCr' || node.op === 'nPr') {
          if (!isNat(a) || !isNat(b) || b > a || a > 170) bad('Argumento inválido en ' + node.op + ': n y r deben ser enteros con 0 ≤ r ≤ n ≤ 170');
          return node.op === 'nCr' ? comb(a, b) : perm(a, b);
        }
        return a ** b;
      }
      case 'fn': {
        const r = FUNCS[node.n](evalTree(node.args[0], env));
        if (!Number.isFinite(r)) bad('Valor fuera de dominio en ' + node.n + '()');
        return r;
      }
    }
  }

  function evaluateEquation(tree, env) {
    const v = evalTree(tree, env);
    if (!Number.isFinite(v)) bad('Resultado no válido');
    return v;
  }

  const parseValue = raw => {
    const t = raw.trim().replace(',', '.');
    return NUM_RE.test(t) ? Number(t) : null;
  };

  // ---------- Lista y búsqueda ----------
  function setMsg(text) { $('eqMsg').textContent = text || ''; }

  function renderList() {
    const list = $('eqList');
    list.textContent = '';
    if (!equations.length) {
      const box = document.createElement('div');
      box.className = 'eq-empty';
      box.textContent = 'Todavía no tienes ecuaciones guardadas.';
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.action = 'new';
      b.textContent = 'Crear primera ecuación';
      box.append(b);
      list.append(box);
      return;
    }
    const q = $('eqSearch').value;
    const items = equations
      .filter(x => normName(x.name).includes(normName(q)))
      .sort((a, b) => a.name.localeCompare(b.name, 'es'));
    if (!items.length) {
      const m = document.createElement('div');
      m.className = 'eq-empty';
      m.textContent = 'No hay ecuaciones que coincidan con «' + q.trim() + '».';
      list.append(m);
      return;
    }
    for (const x of items) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'eq-item';
      b.dataset.id = x.id;
      const name = document.createElement('span');
      name.textContent = x.name;
      const prev = document.createElement('small');
      prev.textContent = x.expr.length > 60 ? x.expr.slice(0, 60) + '…' : x.expr;
      b.append(name, prev);
      list.append(b);
    }
  }

  // ---------- Navegación y gestión ----------
  function setView(v) {
    view = v;
    $('viewCalc').hidden = v !== 'calc';
    $('viewEq').hidden = v !== 'eq';
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
    if (v === 'eq') { if (eq.open) renderEditor(); else renderList(); }
  }

  const isDirty = () => eq.saved
    ? eq.name !== eq.saved.name || eq.expr !== eq.saved.expr
    : eq.name !== '' || eq.expr !== '';
  const guardLeave = () => !isDirty() || confirm('Hay cambios sin guardar. ¿Salir de todos modos?');

  function showList() {
    // Al salir del editor el borrador ya fue confirmado o descartado: se limpia
    Object.assign(eq, { open: false, id: null, name: '', expr: '', saved: null, editing: false, cursor: 0, values: {} });
    $('eqListBox').hidden = false;
    $('eqEditor').hidden = true;
    setMsg('');
    renderList();
  }

  function showEditor() {
    eq.open = true;
    $('eqListBox').hidden = true;
    $('eqEditor').hidden = false;
    setMsg('');
    renderEditor();
  }

  function openEq(id) {
    const rec = equations.find(x => x.id === id);
    if (!rec || !guardLeave()) return;
    Object.assign(eq, { id: rec.id, name: rec.name, expr: rec.expr, saved: { name: rec.name, expr: rec.expr },
      editing: false, cursor: rec.expr.length, values: {} });
    showEditor();
  }

  function newEq() {
    if (!guardLeave()) return;
    Object.assign(eq, { id: null, name: '', expr: '', saved: null, editing: true, cursor: 0, values: {} });
    showEditor();
  }

  function backToList() {
    if (guardLeave()) showList();
  }

  function startEdit() {
    eq.editing = true;
    eq.cursor = eq.expr.length;
    setMsg('');
    renderEditor();
  }

  function cancelEdit() {
    if (isDirty() && !confirm('¿Descartar los cambios sin guardar?')) return;
    if (!eq.saved) return showList();
    Object.assign(eq, { name: eq.saved.name, expr: eq.saved.expr, editing: false, cursor: 0 });
    setMsg('');
    renderEditor();
  }

  function saveEq() {
    const name = eq.name.trim();
    const expr = eq.expr.trim();
    if (!name) return setMsg('Escribe un nombre para la ecuación.');
    try { parseEq(expr); } catch (err) { return setMsg(err.message); }
    const clash = equations.find(x => x.id !== eq.id && sameName(x.name, name));
    if (clash && !confirm('Ya existe una ecuación llamada «' + clash.name + '». ¿Guardar con ese mismo nombre de todos modos?')) return;

    const now = Date.now();
    const rec = eq.id && equations.find(x => x.id === eq.id);
    if (rec) { rec.name = name; rec.expr = expr; rec.updatedAt = now; }
    else {
      eq.id = newId();
      equations.push({ id: eq.id, name, expr, createdAt: now, updatedAt: now });
    }
    persist();
    Object.assign(eq, { name, expr, saved: { name, expr }, editing: false });
    setMsg(storageOk ? 'Ecuación guardada.' : 'No se pudo guardar en este navegador.');
    renderEditor();
  }

  function uniqueCopyName(base) {
    let name = base + ' (copia)';
    for (let k = 2; equations.some(x => sameName(x.name, name)); k++) name = base + ' (copia ' + k + ')';
    return name;
  }

  function duplicateEq() {
    if (!eq.saved) return;
    const now = Date.now();
    const copy = { id: newId(), name: uniqueCopyName(eq.saved.name), expr: eq.saved.expr, createdAt: now, updatedAt: now };
    equations.push(copy);
    persist();
    openEq(copy.id);
  }

  function removeEq() {
    if (!eq.id) return;
    if (!confirm('¿Eliminar «' + eq.saved.name + '»? Esta acción no se puede deshacer.')) return;
    equations = equations.filter(x => x.id !== eq.id);
    persist();
    showList();
  }

  // ---------- Editor ----------
  function renderEditor() {
    const nameInput = $('eqName');
    if (nameInput.value !== eq.name) nameInput.value = eq.name;
    nameInput.readOnly = !eq.editing;
    drawExpr();
    $('eqOrig').textContent = eq.editing && eq.saved ? 'Original guardada: ' + eq.saved.expr : '';

    try {
      cur.tree = parseEq(eq.expr);
      cur.err = '';
    } catch (err) {
      cur.tree = null;
      cur.err = err.message;
    }
    cur.vars = cur.tree ? collectVars(cur.tree) : [];
    for (const v of cur.vars) {
      if (eq.values[v] === undefined && v in CONSTS) eq.values[v] = String(CONSTS[v]);
    }
    drawVars();

    $('eqEdit').hidden = eq.editing;
    $('eqSave').hidden = !eq.editing;
    $('eqSave').textContent = eq.saved ? 'Guardar cambios' : 'Guardar';
    $('eqCancel').hidden = !eq.editing;
    $('eqDup').hidden = eq.editing || !eq.saved;
    $('eqDel').hidden = !eq.saved;
    $('eqKb').hidden = !eq.editing;
    recalc();
  }

  function drawExpr() {
    const el = $('eqExpr');
    el.textContent = '';
    if (!eq.editing) { el.textContent = eq.expr; return; }
    const caret = document.createElement('span');
    caret.className = 'caret';
    el.append(eq.expr.slice(0, eq.cursor), caret, eq.expr.slice(eq.cursor));
  }

  function drawVars() {
    const box = $('eqVars');
    box.textContent = '';
    for (const v of cur.vars) {
      const lab = document.createElement('label');
      const tag = document.createElement('span');
      tag.textContent = v;
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.inputMode = 'decimal';
      inp.autocomplete = 'off';
      inp.placeholder = 'valor';
      inp.dataset.v = v;
      inp.value = eq.values[v] === undefined ? '' : eq.values[v];
      lab.append(tag, inp);
      box.append(lab);
    }
  }

  function showRes(text, kind) {
    const box = $('eqResult');
    box.textContent = text;
    box.className = 'box res' + (kind ? ' ' + kind : '');
  }

  // Recalcula con los valores actuales; no toca la expresión guardada
  let eqValue = null;   // último resultado válido de la ecuación abierta
  function recalc() {
    eqValue = null;
    const inputs = {};
    $('eqVars').querySelectorAll('input').forEach(i => { inputs[i.dataset.v] = i; });
    const env = {};
    const missing = [];
    const invalid = [];
    for (const v of cur.vars) {
      const raw = (eq.values[v] || '').trim();
      const n = raw ? parseValue(raw) : null;
      if (!raw) missing.push(v);
      else if (n === null) invalid.push(v);
      else env[v] = n;
      if (inputs[v]) inputs[v].classList.toggle('bad', !!raw && n === null);
    }
    if (!cur.tree) return showRes(cur.err, 'hint');
    if (invalid.length) return showRes('Valor no válido en ' + invalid.join(', '), 'err');
    if (missing.length) return showRes('Falta valor de ' + missing.join(', '), 'hint');
    try {
      eqValue = evaluateEquation(cur.tree, env);
      showRes(fmt(eqValue), '');
    } catch (err) { showRes(err.message, 'err'); }
  }

  // Calcular: muestra el resultado y lo pasa a la calculadora normal como valor actual y Ans
  function calcAndSend() {
    recalc();
    if (eqValue === null) return;
    lastAns = eqValue;
    tokens = [];
    cursor = 0;
    error = '';
    result = fmt(eqValue);
    justEval = true;
    setView('calc');
    render();
  }

  // ---------- Edición de la expresión (cursor) ----------
  function insertEq(text) {
    if (!eq.editing) return;
    eq.expr = eq.expr.slice(0, eq.cursor) + text + eq.expr.slice(eq.cursor);
    eq.cursor += text.length;
    setMsg('');
    renderEditor();
  }

  function deleteEq() {
    if (!eq.editing || eq.cursor === 0) return;
    const before = eq.expr.slice(0, eq.cursor);
    // Borra un token entero (p. ej. "sin(" o " nCr ") en lugar de un carácter suelto
    const fn = FN_NAMES.slice().sort((a, b) => b.length - a.length).find(n => before.endsWith(n + '('));
    const word = [' nCr ', ' nPr '].find(w => before.endsWith(w));
    const len = fn ? fn.length + 1 : word ? word.length : 1;
    eq.expr = before.slice(0, -len) + eq.expr.slice(eq.cursor);
    eq.cursor -= len;
    renderEditor();
  }

  function moveCursor(d) {
    if (!eq.editing) return;
    eq.cursor = Math.min(eq.expr.length, Math.max(0, eq.cursor + d));
    renderEditor();
  }

  function clearExpr() {
    if (!eq.editing) return;
    eq.expr = '';
    eq.cursor = 0;
    renderEditor();
  }

  // ---------- Teclado virtual (QWERTY, números arriba, operaciones abajo) ----------
  function kbKey(label, action, cls) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    if (cls) b.className = cls;
    b.addEventListener('click', action);
    return b;
  }

  function buildKeyboard() {
    const kb = $('eqKb');
    kb.textContent = '';
    const addRow = (cls, keys) => {
      const row = document.createElement('div');
      row.className = cls;
      keys.forEach(k => row.append(k));
      kb.append(row);
    };
    addRow('kb-row', EQ_DIGITS.map(d => kbKey(d, () => insertEq(d))));
    EQ_LETTERS.forEach((letters, i) => {
      const keys = [...letters].map(L => {
        const ch = kbLower ? L.toLowerCase() : L;
        return kbKey(ch, () => insertEq(ch));
      });
      addRow('kb-row', keys);
    });
    const ops = EQ_OPS.map(([label, text]) => kbKey(label, () => insertEq(text)));
    ops.push(
      kbKey(kbLower ? 'ABC' : 'abc', toggleCase, kbLower ? 'on' : ''),
      kbKey('AC', clearExpr), kbKey('◄', () => moveCursor(-1)), kbKey('►', () => moveCursor(1)), kbKey('DEL', deleteEq)
    );
    addRow('kb-ops', ops);
  }

  function toggleCase() {
    kbLower = !kbLower;
    buildKeyboard();
  }

  // ---------- Eventos ----------
  document.querySelector('.tabs').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) setView(b.dataset.view);
  });
  $('eqSearch').addEventListener('input', renderList);
  $('eqNew').addEventListener('click', newEq);
  $('eqList').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.action === 'new') newEq();
    else if (b.dataset.id) openEq(b.dataset.id);
  });
  $('eqBack').addEventListener('click', backToList);
  $('eqName').addEventListener('input', e => { eq.name = e.target.value; });
  $('eqEdit').addEventListener('click', startEdit);
  $('eqSave').addEventListener('click', saveEq);
  $('eqCancel').addEventListener('click', cancelEdit);
  $('eqDup').addEventListener('click', duplicateEq);
  $('eqDel').addEventListener('click', removeEq);
  $('eqCalc').addEventListener('click', calcAndSend);
  $('eqVars').addEventListener('input', e => {
    const v = e.target.dataset.v;
    if (!v) return;
    eq.values[v] = e.target.value;   // cambia solo esta variable; la expresión no se toca
    recalc();
  });

  // Teclado físico: la letra se inserta tal como se escribe
  window.addEventListener('keydown', e => {
    if (view !== 'eq' || !eq.editing || e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'Backspace') { e.preventDefault(); deleteEq(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); moveCursor(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); moveCursor(1); }
    else if (e.key.length === 1 && EQ_CHAR_RE.test(e.key)) { e.preventDefault(); insertEq(e.key); }
  });

  buildKeyboard();
  showList();
  setView('calc');

  render();
})();
</script>
</body>
</html>
