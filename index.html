<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calculadora científica</title>
<style>
  :root {
    --bg: #e6e6e6;
    --key: #ffffff;
    --line: #9a9a9a;
    --ink: #111;
    --screen: #dfe8d6;
    --shift: #d9730d;
    --alpha: #c0392b;
    --screen-line: #777;
    --muted: #444;
    --press: #ddd;
    --on: #cfcfcf;
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #161618;
    --key: #2a2a2d;
    --line: #55555a;
    --ink: #ececec;
    --screen: #23301f;
    --shift: #f0933a;
    --alpha: #ff6b5b;
    --screen-line: #4a4a4f;
    --muted: #b0b0b5;
    --press: #3b3b40;
    --on: #46464c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .calc {
    max-width: 420px;
    margin: 0 auto;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .screen {
    background: var(--screen);
    border: 2px solid var(--screen-line);
    border-radius: 8px;
    padding: 8px 12px 10px;
    min-height: 124px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    overflow: hidden;
  }
  .ind { font-size: 12px; min-height: 16px; color: var(--muted); }
  .expr {
    font-size: 17px;
    min-height: 24px;
    word-break: break-all;
    white-space: pre-wrap;
  }
  .res {
    font-size: 30px;
    min-height: 40px;
    text-align: right;
    word-break: break-all;
  }
  .caret {
    display: inline-block;
    width: 2px;
    height: 18px;
    background: var(--ink);
    vertical-align: middle;
  }
  .keys { display: grid; gap: 6px; margin-top: 8px; }
  .six { grid-template-columns: repeat(6, 1fr); }
  .five { grid-template-columns: repeat(5, 1fr); }
  .top { margin-top: 12px; }
  button {
    position: relative;
    min-width: 0;
    height: 50px;
    padding: 0;
    background: var(--key);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { background: var(--press); }
  button.on { background: var(--on); }
  button i {
    position: absolute;
    font-style: normal;
    font-size: 9px;
    line-height: 1;
    white-space: nowrap;
  }
  button i.s { top: 4px; left: 5px; color: var(--shift); }
  button i.a { top: 4px; right: 5px; color: var(--alpha); }
  button b { font-weight: 500; }
  [hidden] { display: none !important; }

  /* Pestañas CALCULADORA / EQUATIONS */
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr) 40px; gap: 6px; margin-bottom: 10px; }
  .tabs button { height: 36px; font-size: 12px; letter-spacing: .02em; }
  .tabs button.on { background: var(--on); font-weight: 600; }

  /* EQUATIONS */
  #viewEq button, #viewGr button, #viewSet button, #viewTb button { height: 40px; font-size: 14px; }
  #viewEq input, #viewGr input, #viewTb input {
    width: 100%;
    height: 40px;
    padding: 0 10px;
    font: inherit;
    font-size: 16px;   /* evita el zoom automático de iOS al enfocar */
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--key);
    color: var(--ink);
  }
  #viewEq input.bad, #viewGr input.bad, #viewTb input.bad { border-color: var(--alpha); }
  .gr-row { display: grid; grid-template-columns: 1fr 1fr 40px 40px; gap: 6px; margin-bottom: 6px; }
  .gr-sub-row { display: grid; grid-template-columns: 1fr 1fr 40px; gap: 6px; margin-bottom: 6px; }
  .gr-sub-row button { padding: 0; }
  .gr-subs { margin: 0 0 10px 14px; padding-left: 8px; border-left: 2px solid var(--line); }
  .gr-subs .gr-cols { grid-template-columns: 1fr 1fr 40px; margin-top: 0; }
  .gr-subs .actions { margin-top: 6px; }
  #viewGr input:disabled { opacity: .75; }
  .gr-row button { padding: 0; }
  .gr-cols { display: grid; grid-template-columns: 1fr 1fr 40px 40px; gap: 6px; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .gr-set { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .gr-set label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  .gr-info { font-size: 14px; margin-top: 10px; display: grid; gap: 4px; }
  .gr-info .err { color: var(--alpha); }
  .tb-sel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 6px; }
  .tb-sel.two { grid-template-columns: 1fr 1fr; margin-bottom: 10px; }
  .tb-in { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; margin-top: 12px; }
  .tb-in label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  .set-group { display: grid; gap: 6px; margin-bottom: 4px; }
  .set-theme { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .set-dec { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  #viewSet input { width: 100%; height: 40px; padding: 0 10px; font: inherit; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--key); color: var(--ink); }
  #viewSet input.bad { border-color: var(--alpha); }
  .set-note { font-size: 12px; color: var(--muted); }
  #eqSearch { margin-bottom: 8px; }
  .eq-list { display: grid; gap: 6px; }
  .eq-item { height: auto !important; padding: 8px 10px; text-align: left; display: grid; gap: 2px; }
  .eq-item span { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eq-item small { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eq-empty { background: var(--key); border: 1px dashed var(--line); border-radius: 8px; padding: 14px; font-size: 14px; color: var(--muted); text-align: center; display: grid; gap: 10px; }
  #eqNew { width: 100%; margin-top: 8px; }
  #eqBack { height: 34px !important; font-size: 13px !important; padding: 0 12px !important; }
  .lbl { font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .eq-orig { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 14px; word-break: break-all; }
  .vars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .vars label { display: grid; gap: 3px; font-size: 13px; }
  .vars label span { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
  .msg { font-size: 13px; min-height: 18px; margin-top: 8px; color: var(--muted); }
  .res.hint { font-size: 14px; color: var(--muted); }
  .res.err { font-size: 16px; color: var(--alpha); }
  .eq-head { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; margin-bottom: 10px; }
  .eq-head button { height: 40px; }
  #eqSave { padding: 0 12px; font-size: 14px !important; }
  #eqKb { display: grid; gap: 6px; margin-top: 10px; }
  #eqKb .kb-top, #eqKb .kb-fn { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  #eqKb .kb-pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #eqKb .kb-letters { display: flex; justify-content: center; gap: 4px; }
  #eqKb .kb-letters button { flex: 0 0 calc(10% - 4px); }
  #eqKb .kb-ops10 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  #eqKb button { height: 46px; font-size: 14px; padding: 0; min-width: 0; }
  #eqKb .kb-letters button, #eqKb .kb-ops10 button { height: 42px; font-size: 13px; }
  #eqKb .kb-ops10 button { font-size: 11px; }
  #eqKb button:disabled { opacity: .35; }
  #eqKb button.on { background: var(--on); }

  /* Historial */
  .hist { margin-top: 12px; }
  .hist-head { display: flex; justify-content: space-between; align-items: center; }
  .hist-head .lbl { margin: 0; }
  #histClear { height: 30px !important; font-size: 12px !important; padding: 0 10px !important; }
  #hist { display: grid; gap: 6px; margin-top: 6px; }
  .hist-item { height: auto !important; display: grid; gap: 2px; padding: 6px 10px; text-align: right; }
  .hist-item small { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-item span { font-size: 17px; }
  .hist-empty { font-size: 13px; color: var(--muted); padding: 6px 2px; }

  @media (max-width: 359px) {
    button { font-size: 12px; height: 46px; }
  }
</style>
</head>
<body>
<div class="calc" id="calc">
  <nav class="tabs">
    <button type="button" data-view="calc" class="on">CALC</button>
    <button type="button" data-view="eq">ECUAC.</button>
    <button type="button" data-view="gr">NOTAS</button>
    <button type="button" data-view="tb">TABLAS</button>
    <button type="button" data-view="set" aria-label="Ajustes">⚙</button>
  </nav>

  <div id="viewCalc">
  <div class="screen">
    <div class="ind" id="ind"></div>
    <div class="expr" id="expr"></div>
    <div class="res" id="res"></div>
  </div>

  <div class="keys six top" id="top"></div>
  <div class="keys six" id="sci"></div>
  <div class="keys five" id="num"></div>
  </div>

  <div id="histBox" class="hist">
    <div class="hist-head"><span class="lbl">Historial</span><button type="button" id="histClear">Borrar</button></div>
    <div id="hist"></div>
  </div>

  <section id="viewTb" hidden>
    <div class="tb-sel" id="tbSel">
      <button type="button" data-tb="normal">Normal</button>
      <button type="button" data-tb="t">t</button>
      <button type="button" data-tb="chi">χ²</button>
      <button type="button" data-tb="f">F</button>
    </div>
    <div class="tb-sel two" id="tbMode"><button type="button" data-mode="0"></button><button type="button" data-mode="1"></button></div>
    <div class="screen">
      <div class="ind" id="tbInd"></div>
      <div class="expr" id="tbExpr"></div>
      <div class="res" id="tbRes"></div>
    </div>
    <div class="tb-in" id="tbIn"></div>
    <div class="gr-info" id="tbInfo"></div>
  </section>

  <section id="viewSet" hidden>
    <div class="lbl">Tema</div>
    <div class="set-theme" id="setTheme">
      <button type="button" data-theme="auto">Sistema</button>
      <button type="button" data-theme="light">Claro</button>
      <button type="button" data-theme="dark">Oscuro</button>
    </div>
    <div class="lbl">Notas: aproximación</div>
    <div class="set-group">
      <button type="button" id="setApprox"></button>
      <label class="set-dec">Decimales a los que aproximar (0 a 4)
        <input id="setDec" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
      </label>
      <div class="set-note">Aproxima la nota final (3.95 → 4.0 con 1 decimal) y se usa también al calcular qué nota necesitas.</div>
    </div>
    <div class="lbl">Datos guardados en este navegador</div>
    <div class="set-group">
      <button type="button" id="setHist">Borrar historial de cálculos</button>
      <button type="button" id="setGr">Limpiar notas y ponderaciones</button>
      <button type="button" id="setEq">Borrar todas las ecuaciones</button>
    </div>
    <div class="set-note" id="setNote"></div>
  </section>

  <section id="viewGr" hidden>
    <div class="screen">
      <div class="ind" id="grInd">PROMEDIO PONDERADO</div>
      <div class="expr" id="grExpr"></div>
      <div class="res" id="grRes"></div>
    </div>
    <div class="gr-cols"><span>Nota</span><span>Ponderación (%)</span><span></span><span></span></div>
    <div id="grRows"></div>
    <div class="actions">
      <button type="button" id="grAdd">+ Agregar nota</button>
      <button type="button" id="grFill">+ Nota que falta</button>
      <button type="button" id="grSplit" style="grid-column: 1 / -1">Repartir lo que falta equitativamente</button>
    </div>
    <div class="gr-set" style="margin-top:12px">
      <label>Nota objetivo<input id="grTarget" type="text" inputmode="decimal" autocomplete="off" placeholder="4"></label>
      <label>Mínima<input id="grMin" type="text" inputmode="decimal" autocomplete="off"></label>
      <label>Máxima<input id="grMax" type="text" inputmode="decimal" autocomplete="off"></label>
    </div>
    <div class="gr-info" id="grInfo"></div>
    <div class="actions"><button type="button" id="grClear">Limpiar todo</button></div>
  </section>

  <section id="viewEq" hidden>
    <div id="eqListBox">
      <input id="eqSearch" type="search" placeholder="Buscar por nombre" autocomplete="off">
      <div id="eqList" class="eq-list"></div>
      <button type="button" id="eqNew">+ Nueva ecuación</button>
    </div>

    <div id="eqEditor" hidden>
      <div class="eq-head">
        <button type="button" id="eqBack">←</button>
        <input id="eqName" type="text" maxlength="80" placeholder="Nombre de la ecuación" autocomplete="off">
        <button type="button" id="eqSave">Guardar</button>
      </div>
      <div class="screen">
        <div class="ind" id="eqInd"></div>
        <div class="expr" id="eqExpr"></div>
        <div class="eq-orig" id="eqOrig"></div>
        <div class="res" id="eqResult"></div>
      </div>
      <div class="lbl">Valores</div>
      <div class="vars" id="eqVars"></div>
      <div class="actions">
        <button type="button" id="eqCalc">Calcular</button>
        <button type="button" id="eqEdit">Editar</button>
        <button type="button" id="eqCancel">Cancelar</button>
        <button type="button" id="eqDup">Duplicar</button>
        <button type="button" id="eqDel">Eliminar</button>
      </div>
      <div class="msg" id="eqMsg"></div>
      <div id="eqKb" hidden></div>
    </div>
  </section>
</div>

<script>
(() => {
  // ---------- Estado ----------
  let tokens = [];          // expresión como lista de tokens
  let cursor = 0;           // posición del cursor (REPLAY ◄ ►)
  let result = '';          // último resultado mostrado
  let error = '';           // mensaje de error
  let lastAns = 0;          // Ans
  let justEval = false;     // true tras pulsar '='
  let shift = false, alpha = false;
  let hypP = false, stoP = false, rclP = false, modeP = false;
  let mode = 'COMP';        // COMP | SD
  let angle = 'DEG';        // DEG | RAD | GRA
  let stats = [];           // datos estadísticos (modo SD)
  const mem = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, X: 0, Y: 0, M: 0 };

  const OPS = new Set(['+', '-', '*', '/', '^', 'xroot', 'nCr', 'nPr', '!', 'sq', 'cu', 'inv', '%', ')', ',']);
  const DISP = {
    NEG: '−', '*': '×', '/': '÷', sqrt: '√', cbrt: '³√', sq: '²', cu: '³', inv: '⁻¹',
    pow10: '10ˣ', exp: 'eˣ', asin: 'sin⁻¹', acos: 'cos⁻¹', atan: 'tan⁻¹',
    asinh: 'sinh⁻¹', acosh: 'cosh⁻¹', atanh: 'tanh⁻¹', EXP: 'EXP', EULER: 'e', PI: 'π',
    ANS: 'Ans', RAN: 'Ran#', N: 'n', SUMX: 'Σx', SUMX2: 'Σx²', MEAN: 'x̄', SDP: 'xσn',
    SDS: 'xσn-1', xroot: 'ˣ√', nCr: 'C', nPr: 'P', Pol: 'Pol', Rec: 'Rec'
  };
  const MODES = {
    d1: ['mode', 'COMP'], d2: ['mode', 'SD'],
    d3: ['angle', 'DEG'], d4: ['angle', 'RAD'], d5: ['angle', 'GRA']
  };

  // ---------- Errores y utilidades ----------
  const syn = () => { throw new Error('Syntax ERROR'); };
  const math = () => { throw new Error('Math ERROR'); };
  const noop = () => {};
  const toRad = x => angle === 'DEG' ? x * Math.PI / 180 : angle === 'GRA' ? x * Math.PI / 200 : x;
  const fromRad = x => angle === 'DEG' ? x * 180 / Math.PI : angle === 'GRA' ? x * 200 / Math.PI : x;

  const fact = n => {
    if (!Number.isInteger(n) || n < 0 || n > 170) math();
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  };
  const comb = (n, r) => {
    if (!Number.isInteger(n) || !Number.isInteger(r) || r < 0 || r > n) math();
    return Math.round(fact(n) / (fact(r) * fact(n - r)));
  };
  const perm = (n, r) => {
    if (!Number.isInteger(n) || !Number.isInteger(r) || r < 0 || r > n) math();
    return Math.round(fact(n) / fact(n - r));
  };
  const pol = (x, y) => { mem.Y = fromRad(Math.atan2(y, x)); return Math.hypot(x, y); };
  const rec = (r, t) => { const a = toRad(t); mem.Y = r * Math.sin(a); return r * Math.cos(a); };

  const FUNCS = {
    sin: x => Math.sin(toRad(x)), cos: x => Math.cos(toRad(x)), tan: x => Math.tan(toRad(x)),
    asin: x => fromRad(Math.asin(x)), acos: x => fromRad(Math.acos(x)), atan: x => fromRad(Math.atan(x)),
    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
    asinh: Math.asinh, acosh: Math.acosh, atanh: Math.atanh,
    log: Math.log10, ln: Math.log, sqrt: Math.sqrt, cbrt: Math.cbrt,
    exp: Math.exp, pow10: x => 10 ** x
  };

  const sum = a => a.reduce((s, x) => s + x, 0);
  const mean = () => { if (!stats.length) math(); return sum(stats) / stats.length; };
  const sdev = k => {
    const n = stats.length;
    if (n <= k) math();
    const m = mean();
    return Math.sqrt(stats.reduce((s, x) => s + (x - m) ** 2, 0) / (n - k));
  };

  // ---------- Parser (descenso recursivo) ----------
  let tks = [], pos = 0;
  const peek = () => tks[pos];
  const expect = t => { if (peek() !== t) syn(); pos++; };
  const isDigit = t => /^[0-9.]$/.test(t || '');
  const VARS = ['PI', 'EULER', 'ANS', 'RAN', 'N', 'SUMX', 'SUMX2', 'MEAN', 'SDP', 'SDS', 'A', 'B', 'C', 'D', 'E', 'F', 'X', 'Y', 'M'];
  const startsPrimary = t => t !== undefined && (isDigit(t) || t === '(' || t === 'Pol' || t === 'Rec' || t in FUNCS || VARS.includes(t));

  function parseExpr() {
    let v = parseTerm();
    for (;;) {
      const t = peek();
      if (t === '+') { pos++; v += parseTerm(); }
      else if (t === '-') { pos++; v -= parseTerm(); }
      else return v;
    }
  }

  function parseTerm() {
    let v = parseUnary();
    for (;;) {
      const t = peek();
      if (t === '*') { pos++; v *= parseUnary(); }
      else if (t === '/') { pos++; v /= parseUnary(); }
      else if (startsPrimary(t)) { v *= parseUnary(); } // multiplicación implícita: 2π, 3(4)
      else return v;
    }
  }

  function parseUnary() {
    const t = peek();
    if (t === 'NEG' || t === '-') { pos++; return -parseUnary(); }
    if (t === '+') { pos++; return parseUnary(); }
    return parsePower();
  }

  function parsePower() {
    let v = parsePostfix();
    for (;;) {
      const t = peek();
      if (t === '^') { pos++; v = v ** parseUnary(); }
      else if (t === 'xroot') { pos++; const b = parseUnary(); v = b ** (1 / v); }
      else if (t === 'nCr') { pos++; v = comb(v, parseUnary()); }
      else if (t === 'nPr') { pos++; v = perm(v, parseUnary()); }
      else return v;
    }
  }

  function parsePostfix() {
    let v = parsePrimary();
    for (;;) {
      const t = peek();
      if (t === '!') { pos++; v = fact(v); }
      else if (t === 'sq') { pos++; v *= v; }
      else if (t === 'cu') { pos++; v **= 3; }
      else if (t === 'inv') { pos++; v = 1 / v; }
      else if (t === '%') { pos++; v /= 100; }
      else return v;
    }
  }

  function parsePrimary() {
    const t = peek();
    if (t === undefined) syn();

    if (isDigit(t)) {
      let s = '';
      while (isDigit(peek())) s += tks[pos++];
      if (peek() === 'EXP') {
        pos++;
        let sign = '';
        if (peek() === 'NEG' || peek() === '-') { sign = '-'; pos++; }
        let e = '';
        while (/^[0-9]$/.test(peek() || '')) e += tks[pos++];
        if (!e) syn();
        s += 'e' + sign + e;
      }
      if (!/\d/.test(s.split('e')[0]) || (s.match(/\./g) || []).length > 1) syn();
      return parseFloat(s);
    }

    if (t === '(') { pos++; const v = parseExpr(); expect(')'); return v; }

    if (t in FUNCS) {
      pos++; expect('('); const v = parseExpr(); expect(')');
      return FUNCS[t](v);
    }

    if (t === 'Pol' || t === 'Rec') {
      pos++; expect('('); const a = parseExpr(); expect(','); const b = parseExpr(); expect(')');
      return t === 'Pol' ? pol(a, b) : rec(a, b);
    }

    pos++;
    switch (t) {
      case 'PI': return Math.PI;
      case 'EULER': return Math.E;
      case 'ANS': return lastAns;
      case 'RAN': return Math.random();
      case 'N': return stats.length;
      case 'SUMX': return sum(stats);
      case 'SUMX2': return sum(stats.map(x => x * x));
      case 'MEAN': return mean();
      case 'SDP': return sdev(0);
      case 'SDS': return sdev(1);
      default:
        if (t in mem) return mem[t];
        syn();
    }
  }

  function evaluate(list) {
    tks = list.slice();
    let open = 0;
    for (const t of tks) { if (t === '(') open++; else if (t === ')') open--; }
    while (open-- > 0) tks.push(')');   // cierre automático de paréntesis
    pos = 0;
    const v = parseExpr();
    if (pos !== tks.length) syn();
    if (!Number.isFinite(v)) math();
    return v;
  }

  const evalTokens = () => tokens.length ? evaluate(tokens) : lastAns;

  // ---------- Formato del resultado ----------
  function fmt(v) {
    if (v === 0) return '0';
    const a = Math.abs(v);
    if (a >= 1e10 || a < 1e-6) {

    return String(parseFloat(v.toPrecision(10)));

  // ---------- Edición de la expresión ----------
  function ins(...t) {

    cursor += t.length;
    error = '';

  function fmtEng(v, e) {

  function engStep(dir) {
    if (!justEval || !Number.isFinite(lastAns) || lastAns === 0) return;
    if (engExp === null) {

      engExp = Math.floor(e10 / 3) * 3 + (dir < 0 ? -3 : 0);
    } else engExp += 3 * dir;
    result = fmtEng(lastAns, engExp);

  function clearAll() {

  function evalNow() {
    try {
      const v = evalTokens();

      lastAns = v;
      result = fmt(v);
      error = '';
      justEval = true;
      cursor = tokens.length;
    } catch (e) {
      error = e.message; result = ''; justEval = false;
    }
  }

    try {

      tokens = []; cursor = 0;
      result = fmt(v); error = ''; justEval = true;
    } catch (e) { error = e.message; }
  }

  function memOp(sign) {
    if (mode === 'SD' && sign < 0) { stats.pop(); return; }
    try {
      const v = evalTokens();
      if (mode === 'SD') stats.push(v); else mem.M += sign * v;
      tokens = []; cursor = 0;
      result = fmt(v); error = ''; justEval = true;
    } catch (e) { error = e.message; }
  }

  function trig(name) {
    let n = name;
    if (hypP) { n = name.replace(/^(a?)(sin|cos|tan)$/, '$1$2h'); hypP = false; }
    ins(n, '(');
  }

  // ---------- Teclas ----------
  const K = {};
  const def = (id, o) => { K[id] = o; };

  for (let d = 0; d <= 9; d++) def('d' + d, { l: String(d), m: () => ins(String(d)) });
  def('d7', { l: '7', s: 'n', m: () => ins('7'), sh: () => ins('N') });
  def('d8', { l: '8', s: 'Σx', m: () => ins('8'), sh: () => ins('SUMX') });
  def('d9', { l: '9', s: 'Σx²', m: () => ins('9'), sh: () => ins('SUMX2') });
  def('d1', { l: '1', s: 'x̄', m: () => ins('1'), sh: () => ins('MEAN') });
  def('d2', { l: '2', s: 'xσn', m: () => ins('2'), sh: () => ins('SDP') });
  def('d3', { l: '3', s: 'xσn-1', m: () => ins('3'), sh: () => ins('SDS') });
  def('d0', { l: '0', s: 'Rnd', m: () => ins('0'), sh: noop });

  def('inv', { l: 'x⁻¹', s: 'x!', m: () => ins('inv'), sh: () => ins('!') });
  def('ncr', { l: 'nCr', s: 'nPr', m: () => ins('nCr'), sh: () => ins('nPr') });
  def('pol', { l: 'Pol(', s: 'Rec(', m: () => ins('Pol', '('), sh: () => ins('Rec', '(') });
  def('cbrt', { l: '³√', m: () => ins('cbrt', '(') });
  def('cu', { l: 'x³', m: () => ins('cu') });
  def('pow', { l: 'xʸ', s: 'ˣ√', m: () => ins('^'), sh: () => ins('xroot') });

  def('eng', { l: 'ENG', s: 'ENG←', m: () => engStep(1), sh: () => engStep(-1) });
  def('abc', { l: 'a b/c', s: 'd/c', m: noop });
  def('sqrt', { l: '√', m: () => ins('sqrt', '(') });
  def('sq', { l: 'x²', m: () => ins('sq') });
  def('log', { l: 'log', s: '10ˣ', m: () => ins('log', '('), sh: () => ins('pow10', '(') });
  def('ln', { l: 'ln', s: 'eˣ', m: () => ins('ln', '('), sh: () => ins('exp', '(') });

  def('neg', { l: '(−)', v: 'A', m: () => ins('NEG') });
  def('deg', { l: '°′″', v: 'B', m: noop });
  def('hyp', { l: 'hyp', v: 'C', m: () => { hypP = true; } });
  def('sin', { l: 'sin', s: 'sin⁻¹', v: 'D', m: () => trig('sin'), sh: () => trig('asin') });
  def('cos', { l: 'cos', s: 'cos⁻¹', v: 'E', m: () => trig('cos'), sh: () => trig('acos') });
  def('tan', { l: 'tan', s: 'tan⁻¹', v: 'F', m: () => trig('tan'), sh: () => trig('atan') });

  def('sto', { l: 'STO', m: () => { stoP = true; } });
  def('rcl', { l: 'RCL', m: () => { rclP = true; } });
  def('lp', { l: '(', m: () => ins('(') });
  def('rp', { l: ')', v: 'X', m: () => ins(')') });
  def('comma', { l: ',', v: 'Y', m: () => ins(',') });
  def('mplus', { l: 'M+', s: 'M−', v: 'M', m: () => memOp(1), sh: () => memOp(-1) });

  def('del', { l: 'DEL', s: 'INS', m: del, sh: noop });
  def('ac', { l: 'AC', s: 'Mcl', m: clearAll, sh: () => { stats = []; } });
  def('eq', { l: '=', s: '%', m: evalNow, sh: () => ins('%') });

  def('add', { l: '+', m: () => ins('+') });
  def('sub', { l: '−', m: () => ins('-') });
  def('mul', { l: '×', m: () => ins('*') });
  def('div', { l: '÷', m: () => ins('/') });
  def('dot', { l: '.', s: 'Ran#', m: () => ins('.'), sh: () => ins('RAN') });
  def('exp', { l: 'EXP', s: 'π', m: () => ins('EXP'), sh: () => ins('PI') });
  def('ans', { l: 'Ans', s: 'DRG▶', m: () => ins('ANS'), sh: noop });

  def('left', { l: '◄', m: () => { cursor = Math.max(0, cursor - 1); } });
  def('right', { l: '►', m: () => { cursor = Math.min(tokens.length, cursor + 1); } });
  def('mode', { l: 'MODE', m: () => { modeP = true; } });
  def('on', { l: 'ON', m: clearAll });
  def('shift', { l: 'SHIFT' });
  def('alpha', { l: 'ALPHA' });

  // ---------- Despacho de pulsaciones ----------
  const TRIG_IDS = ['sin', 'cos', 'tan'];

  function handle(id) {
    const k = K[id];
    if (!k) return;

    if (id === 'shift') { shift = !shift; alpha = false; return; }
    if (id === 'alpha') { alpha = !alpha; shift = false; return; }

    if (modeP) {
      modeP = false;
      const m = MODES[id];
      if (m) { if (m[0] === 'mode') mode = m[1]; else angle = m[1]; }
      return;
    }

    // STO/RCL seguido de ALPHA + variable
    if ((stoP || rclP) && alpha && k.v) {
      alpha = false; shift = false;
      if (stoP) { stoP = false; storeVar(k.v); }
      else { rclP = false; ins(k.v); }
      return;
    }
    stoP = rclP = false;

    if (!TRIG_IDS.includes(id) && id !== 'hyp') hypP = false;

    if (id !== 'eng') engExp = null;

    const useShift = shift, useAlpha = alpha;
    shift = alpha = false;

    if (useShift) (k.sh || noop)();
    else if (useAlpha) (k.v ? () => ins(k.v) : noop)();
    else (k.m || noop)();
  }

  function press(id) {
    handle(id);
    render();
  }

  // ---------- Pantalla ----------
  const $ = id => document.getElementById(id);

  function render() {
    $('expr').innerHTML = tokens.map((t, i) =>
      (i === cursor ? '<span class="caret"></span>' : '') + (DISP[t] || t)
    ).join('') + (cursor === tokens.length ? '<span class="caret"></span>' : '');

    $('res').textContent = error || result;

    $('ind').textContent = [
      shift ? 'SHIFT' : '', alpha ? 'ALPHA' : '', hypP ? 'HYP' : '',
      stoP ? 'STO' : '', rclP ? 'RCL' : '', modeP ? 'MODE?' : '',
      mode, angle
    ].filter(Boolean).join(' · ');

    document.querySelector('[data-k="shift"]').classList.toggle('on', shift);
    document.querySelector('[data-k="alpha"]').classList.toggle('on', alpha);
  }

  // ---------- Construcción del teclado ----------
  const LAYOUT = {
    top: [['shift', 'alpha', 'left', 'right', 'mode', 'on']],
    sci: [
      ['inv', 'ncr', 'pol', 'cbrt', 'cu', 'pow'],
      ['eng', 'abc', 'sqrt', 'sq', 'log', 'ln'],
      ['neg', 'deg', 'hyp', 'sin', 'cos', 'tan'],
      ['sto', 'rcl', 'lp', 'rp', 'comma', 'mplus']
    ],
    num: [
      ['d7', 'd8', 'd9', 'del', 'ac'],
      ['d4', 'd5', 'd6', 'mul', 'div'],
      ['d1', 'd2', 'd3', 'add', 'sub'],
      ['d0', 'dot', 'exp', 'ans', 'eq']
    ]
  };

  const btn = id => {
    const k = K[id];
    return `<button type="button" data-k="${id}">` +
      (k.s ? `<i class="s">${k.s}</i>` : '') +
      `<b>${k.l}</b>` +

    el.innerHTML = rows.flat().map(btn).join('');
  }

  // Delegación de clics: cada botón lleva su id en data-k
  $('viewCalc').addEventListener('click', e => {

  });

  const KEYMAP = {
    '+': 'add', '-': 'sub', '*': 'mul', '/': 'div', '.': 'dot',
    '(': 'lp', ')': 'rp', ',': 'comma', '^': 'pow',
    Enter: 'eq', '=': 'eq', Backspace: 'del', Delete: 'del', Escape: 'ac',
    ArrowLeft: 'left', ArrowRight: 'right'
  };
  window.addEventListener('keydown', e => {
    if (view !== 'calc' || e.ctrlKey || e.metaKey || e.altKey) return;

    if (!id) return;
    e.preventDefault();
    press(id);
  });

  // ================= EQUATIONS =================
  let view = 'calc';
  const STORE_KEY = 'calc.equations.v1';
  const CONSTS = { 'π': Math.PI, e: Math.E };          // constantes: valor inicial editable
  const FN_NAMES = ['asinh', 'acosh', 'atanh', 'asin', 'acos', 'atan', 'sinh', 'cosh', 'tanh',
    'sin', 'cos', 'tan', 'log', 'ln', 'sqrt', 'cbrt', 'exp', 'pow10'];
  const NUM_RE = /^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i;
  const EQ_LETTERS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
  const EQ_CHAR_RE = /^[A-Za-z0-9.+\-*/^()!,_]$/;
  // Cómo se ve la expresión en pantalla (la expresión guardada usa la notación interna)
  const EQ_DISP = [[' nCr ', ' C '], [' nPr ', ' P '], ['pow10(', '10ˣ('], ['exp(', 'eˣ('],
    ['asin(', 'sin⁻¹('], ['acos(', 'cos⁻¹('], ['atan(', 'tan⁻¹('], ['sqrt(', '√('], ['cbrt(', '³√('],
    ['^(-1)', '⁻¹'], ['^2', '²'], ['^3', '³'], ['*', '×'], ['/', '÷']];
  const SUB_DIGITS = '₀₁₂₃₄₅₆₇₈₉';
  // Los subíndices se guardan como A_1 y se muestran como A₁
  const showExpr = s => EQ_DISP.reduce((o, [a, b]) => o.split(a).join(b), s)
    .replace(/_(\d+)/g, (m, d) => [...d].map(c => SUB_DIGITS[+c]).join(''));
  const DEL_TOKENS = [...FN_NAMES.map(n => n + '('), '^(-1)', '^2', '^3', ' nCr ', ' nPr ']
    .sort((a, b) => b.length - a.length);

  const eq = { open: false, id: null, name: '', expr: '', saved: null, editing: false, cursor: 0, values: {} };
  let cur = { tree: null, err: '', vars: [] };   // análisis de la expresión de trabajo
  let kbLower = false;

  // ---------- Almacenamiento ----------
  const normName = s => s.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const sameName = (a, b) => normName(a) === normName(b);
  const newId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : 'eq-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function loadEquations() {
    try {
      const data = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
      return Array.isArray(data)
        ? data.filter(x => x && typeof x.id === 'string' && typeof x.name === 'string' && typeof x.expr === 'string')
        : [];
    } catch (err) { return []; }
  }
  // Convierte la notación antigua C(n,r) / P(n,r) de ecuaciones guardadas a n nCr r / n nPr r
  function migrateExpr(s) {
    const step = t => t.replace(/(^|[^A-Za-z])([CP])\(([^(),]*),([^()]*)\)/g,
      (m, pre, f, a, b) => `${pre}(${a.trim()}) ${f === 'C' ? 'nCr' : 'nPr'} (${b.trim()})`);
    let out = s;
    let next = step(out);
    while (next !== out) { out = next; next = step(out); }
    return out;
  }
  let equations = loadEquations().map(x => ({ ...x, expr: migrateExpr(x.expr) }));
  let storageOk = true;
  function persist() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(equations)); storageOk = true; }
    catch (err) { storageOk = false; }
  }

  // ---------- Tokenizador ----------
  const bad = msg => { throw new Error(msg); };
  const isNat = x => Number.isInteger(x) && x >= 0;

  function tokenize(src) {
    const out = [];
    let i = 0;
    while (i < src.length) {
      const ch = src[i];
      if (ch === ' ') { i++; continue; }
      if (/[0-9.]/.test(ch)) {
        const m = /^(\d+\.?\d*|\.\d+)/.exec(src.slice(i));
        if (!m || src[i + m[1].length] === '.') bad('Número mal formado');
        out.push({ t: 'num', v: parseFloat(m[1]) });
        i += m[1].length;
        continue;
      }
      if (src.startsWith('nCr', i) || src.startsWith('nPr', i)) {
        out.push({ t: 'op', v: src.slice(i, i + 3) });   // operador infijo, como la tecla nCr/nPr
        i += 3;
        continue;
      }
      if (/[A-Za-zπ]/.test(ch)) {
        const fn = FN_NAMES.find(n => src.startsWith(n, i) && src[i + n.length] === '(');
        if (fn) { out.push({ t: 'fn', n: fn }); i += fn.length; continue; }
        // Una letra es variable (distingue mayúsculas); 'e' minúscula y 'π' son constantes.
        // Con subíndice (A_1) la letra más sus dígitos cuentan como una sola variable.
        const sub = /^_(\d+)/.exec(src.slice(i + 1));
        const name = sub ? ch + '_' + sub[1] : ch;
        out.push({ t: name === 'e' || name === 'π' ? 'const' : 'var', n: name });
        i += name.length;
        continue;
      }
      if (ch === '_') bad('El subíndice va justo después de una letra');
      if (!'+-*/^(),!'.includes(ch)) bad('Carácter no válido: ' + ch);
      out.push({ t: 'op', v: ch });
      i++;
    }
    return out;
  }

  // ---------- Analizador sintáctico → árbol (sin ejecutar código) ----------
  function parseEq(src) {
    const toks = tokenize(src);
    if (!toks.length) bad('Escribe una expresión.');
    let p = 0;
    const at = () => toks[p];
    const isOp = v => !!at() && at().t === 'op' && at().v === v;
    const expect = v => { if (!isOp(v)) bad('Expresión mal formada'); p++; };
    const startsPrimary = tk => !!tk && (tk.t === 'num' || tk.t === 'var' || tk.t === 'const' || tk.t === 'fn' || (tk.t === 'op' && tk.v === '('));

    function expr() {
      let n = term();
      while (isOp('+') || isOp('-')) { const op = toks[p++].v; n = { t: 'bin', op, a: n, b: term() }; }
      return n;
    }
    function term() {
      let n = unary();
      for (;;) {
        if (isOp('*') || isOp('/')) { const op = toks[p++].v; n = { t: 'bin', op, a: n, b: unary() }; }
        else if (startsPrimary(at())) { n = { t: 'bin', op: '*', a: n, b: unary() }; }  // 2π, 3(4), 2x
        else return n;
      }
    }
    function unary() {
      if (isOp('-')) { p++; return { t: 'neg', a: unary() }; }
      if (isOp('+')) { p++; return unary(); }
      return power();
    }
    function power() {
      let base = postfix();
      while (isOp('nCr') || isOp('nPr')) { const op = toks[p++].v; base = { t: 'bin', op, a: base, b: postfix() }; }
      if (isOp('^')) { p++; return { t: 'bin', op: '^', a: base, b: unary() }; }
      return base;
    }
    function postfix() {
      let n = primary();
      while (isOp('!')) { p++; n = { t: 'fact', a: n }; }
      return n;
    }
    function primary() {
      const tk = at();
      if (!tk) bad('Expresión mal formada');
      if (tk.t === 'num') { p++; return { t: 'num', v: tk.v }; }
      if (tk.t === 'var' || tk.t === 'const') { p++; return { t: tk.t, n: tk.n }; }
      if (tk.t === 'fn') {
        p++;
        expect('(');
        const arg = expr();
        expect(')');
        return { t: 'fn', n: tk.n, args: [arg] };
      }
      if (isOp('(')) { p++; const n = expr(); expect(')'); return n; }
      bad('Expresión mal formada');
    }
    const tree = expr();
    if (p !== toks.length) bad('Expresión mal formada');
    return tree;
  }

  function collectVars(node, out = []) {
    if (node.t === 'var' || node.t === 'const') { if (!out.includes(node.n)) out.push(node.n); }
    else if (node.t === 'bin') { collectVars(node.a, out); collectVars(node.b, out); }
    else if (node.t === 'neg' || node.t === 'fact') collectVars(node.a, out);
    else if (node.t === 'fn') node.args.forEach(a => collectVars(a, out));
    return out;
  }

  // ---------- Evaluación del árbol con valores numéricos ----------
  function evalTree(node, env) {
    switch (node.t) {
      case 'num': return node.v;
      case 'var':
      case 'const': {
        const v = env[node.n];
        if (v === undefined) bad('Falta valor de ' + showExpr(node.n));
        return v;
      }
      case 'neg': return -evalTree(node.a, env);
      case 'fact': {
        const n = evalTree(node.a, env);
        if (!isNat(n) || n > 170) bad('Factorial solo admite enteros de 0 a 170');
        return fact(n);
      }
      case 'bin': {
        const a = evalTree(node.a, env);
        const b = evalTree(node.b, env);
        if (node.op === '+') return a + b;
        if (node.op === '-') return a - b;
        if (node.op === '*') return a * b;
        if (node.op === '/') { if (b === 0) bad('División por cero'); return a / b; }
        if (node.op === 'nCr' || node.op === 'nPr') {
          if (!isNat(a) || !isNat(b) || b > a || a > 170) bad('Argumento inválido en ' + node.op + ': n y r deben ser enteros con 0 ≤ r ≤ n ≤ 170');
          return node.op === 'nCr' ? comb(a, b) : perm(a, b);
        }
        return a ** b;
      }
      case 'fn': {
        const r = FUNCS[node.n](evalTree(node.args[0], env));
        if (!Number.isFinite(r)) bad('Valor fuera de dominio en ' + node.n + '()');
        return r;
      }
    }
  }

  function evaluateEquation(tree, env) {
    const v = evalTree(tree, env);
    if (!Number.isFinite(v)) bad('Resultado no válido');
    return v;
  }

  const parseValue = raw => {
    const t = raw.trim().replace(',', '.');
    return NUM_RE.test(t) ? Number(t) : null;
  };

  // ---------- Lista y búsqueda ----------
  function setMsg(text) { $('eqMsg').textContent = text || ''; }

  function renderList() {
    const list = $('eqList');
    list.textContent = '';
    if (!equations.length) {
      const box = document.createElement('div');
      box.className = 'eq-empty';
      box.textContent = 'Todavía no tienes ecuaciones guardadas.';
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.action = 'new';
      b.textContent = 'Crear primera ecuación';
      box.append(b);
      list.append(box);
      return;
    }
    const q = $('eqSearch').value;
    const items = equations
      .filter(x => normName(x.name).includes(normName(q)))
      .sort((a, b) => a.name.localeCompare(b.name, 'es'));
    if (!items.length) {
      const m = document.createElement('div');
      m.className = 'eq-empty';
      m.textContent = 'No hay ecuaciones que coincidan con «' + q.trim() + '».';
      list.append(m);
      return;
    }
    for (const x of items) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'eq-item';
      b.dataset.id = x.id;
      const name = document.createElement('span');
      name.textContent = x.name;
      const prev = document.createElement('small');
      const shown = showExpr(x.expr);
      prev.textContent = shown.length > 60 ? shown.slice(0, 60) + '…' : shown;
      b.append(name, prev);
      list.append(b);
    }
  }

  // ---------- Navegación y gestión ----------
  function setView(v) {
    view = v;
    $('viewCalc').hidden = v !== 'calc';
    $('viewEq').hidden = v !== 'eq';
    $('viewGr').hidden = v !== 'gr';
    $('viewSet').hidden = v !== 'set';
    $('viewTb').hidden = v !== 'tb';
    $('histBox').hidden = v !== 'calc';
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
    if (v === 'eq') { if (eq.open) renderEditor(); else renderList(); }
  }

  const isDirty = () => eq.saved
    ? eq.name !== eq.saved.name || eq.expr !== eq.saved.expr
    : eq.name !== '' || eq.expr !== '';
  const guardLeave = () => !isDirty() || confirm('Hay cambios sin guardar. ¿Salir de todos modos?');

  function showList() {
    // Al salir del editor el borrador ya fue confirmado o descartado: se limpia
    Object.assign(eq, { open: false, id: null, name: '', expr: '', saved: null, editing: false, cursor: 0, values: {} });
    $('eqListBox').hidden = false;
    $('eqEditor').hidden = true;
    setMsg('');
    renderList();
  }

  function showEditor() {
    eq.open = true;
    $('eqListBox').hidden = true;
    $('eqEditor').hidden = false;
    setMsg('');
    renderEditor();
  }

  function openEq(id) {
    const rec = equations.find(x => x.id === id);
    if (!rec || !guardLeave()) return;
    Object.assign(eq, { id: rec.id, name: rec.name, expr: rec.expr, saved: { name: rec.name, expr: rec.expr },
      editing: false, cursor: rec.expr.length, values: {} });
    showEditor();
  }

  function newEq() {
    if (!guardLeave()) return;
    Object.assign(eq, { id: null, name: '', expr: '', saved: null, editing: true, cursor: 0, values: {} });
    showEditor();
  }

  function backToList() {
    if (guardLeave()) showList();
  }

  function startEdit() {
    eq.editing = true;
    eq.cursor = eq.expr.length;
    setMsg('');
    renderEditor();
  }

  function cancelEdit() {
    if (isDirty() && !confirm('¿Descartar los cambios sin guardar?')) return;
    if (!eq.saved) return showList();
    Object.assign(eq, { name: eq.saved.name, expr: eq.saved.expr, editing: false, cursor: 0 });
    setMsg('');
    renderEditor();
  }

  function saveEq() {
    const name = eq.name.trim();
    const expr = eq.expr.trim();
    if (!name) return setMsg('Escribe un nombre para la ecuación.');
    try { parseEq(expr); } catch (err) { return setMsg(err.message); }
    const clash = equations.find(x => x.id !== eq.id && sameName(x.name, name));
    if (clash && !confirm('Ya existe una ecuación llamada «' + clash.name + '». ¿Guardar con ese mismo nombre de todos modos?')) return;

    const now = Date.now();
    const rec = eq.id && equations.find(x => x.id === eq.id);
    if (rec) { rec.name = name; rec.expr = expr; rec.updatedAt = now; }
    else {
      eq.id = newId();
      equations.push({ id: eq.id, name, expr, createdAt: now, updatedAt: now });
    }
    persist();
    Object.assign(eq, { name, expr, saved: { name, expr }, editing: false });
    setMsg(storageOk ? 'Ecuación guardada.' : 'No se pudo guardar en este navegador.');
    renderEditor();
  }

  function uniqueCopyName(base) {
    let name = base + ' (copia)';
    for (let k = 2; equations.some(x => sameName(x.name, name)); k++) name = base + ' (copia ' + k + ')';
    return name;
  }

  function duplicateEq() {
    if (!eq.saved) return;
    const now = Date.now();
    const copy = { id: newId(), name: uniqueCopyName(eq.saved.name), expr: eq.saved.expr, createdAt: now, updatedAt: now };
    equations.push(copy);
    persist();
    openEq(copy.id);
  }

  function removeEq() {
    if (!eq.id) return;
    if (!confirm('¿Eliminar «' + eq.saved.name + '»? Esta acción no se puede deshacer.')) return;
    equations = equations.filter(x => x.id !== eq.id);
    persist();
    showList();
  }

  // ---------- Editor ----------
  function renderEditor() {
    const nameInput = $('eqName');
    if (nameInput.value !== eq.name) nameInput.value = eq.name;
    nameInput.readOnly = !eq.editing;
    drawExpr();
    $('eqOrig').textContent = eq.editing && eq.saved ? 'Original guardada: ' + showExpr(eq.saved.expr) : '';

    try {
      cur.tree = parseEq(eq.expr);
      cur.err = '';
    } catch (err) {
      cur.tree = null;
      cur.err = err.message;
    }
    cur.vars = cur.tree ? collectVars(cur.tree) : [];
    for (const v of cur.vars) {
      if (eq.values[v] === undefined && v in CONSTS) eq.values[v] = String(CONSTS[v]);
    }
    drawVars();

    $('eqEdit').hidden = eq.editing;
    $('eqSave').hidden = !eq.editing;
    $('eqSave').textContent = 'Guardar';
    $('eqCancel').hidden = !eq.editing;
    $('eqDup').hidden = eq.editing || !eq.saved;
    $('eqDel').hidden = !eq.saved;
    $('eqKb').hidden = !eq.editing;
    if (eq.editing) renderKb();
    $('eqInd').textContent = eq.editing
      ? (kbLetters ? 'LETRAS' : 'NÚMEROS') + (kbLower ? ' · minúsculas' : '') + (shiftOn ? ' · SHIFT' : '')
      : '';
    recalc();
  }

  function drawExpr() {
    const el = $('eqExpr');
    el.textContent = '';
    if (!eq.editing) { el.textContent = showExpr(eq.expr); return; }
    const caret = document.createElement('span');
    caret.className = 'caret';
    el.append(showExpr(eq.expr.slice(0, eq.cursor)), caret, showExpr(eq.expr.slice(eq.cursor)));
  }

  function drawVars() {
    const box = $('eqVars');
    box.textContent = '';
    for (const v of cur.vars) {
      const lab = document.createElement('label');
      const tag = document.createElement('span');
      tag.textContent = showExpr(v);
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.inputMode = 'decimal';
      inp.autocomplete = 'off';
      inp.placeholder = 'valor';
      inp.dataset.v = v;
      inp.value = eq.values[v] === undefined ? '' : eq.values[v];
      lab.append(tag, inp);
      box.append(lab);
    }
  }

  function showRes(text, kind) {
    const box = $('eqResult');
    box.textContent = text;
    box.className = 'res' + (kind ? ' ' + kind : '');
  }

  // Recalcula con los valores actuales; no toca la expresión guardada
  let eqValue = null;   // último resultado válido de la ecuación abierta
  function recalc() {
    eqValue = null;
    const inputs = {};
    $('eqVars').querySelectorAll('input').forEach(i => { inputs[i.dataset.v] = i; });
    const env = {};
    const missing = [];
    const invalid = [];
    for (const v of cur.vars) {
      const raw = (eq.values[v] || '').trim();
      const n = raw ? parseValue(raw) : null;
      if (!raw) missing.push(v);
      else if (n === null) invalid.push(v);
      else env[v] = n;
      if (inputs[v]) inputs[v].classList.toggle('bad', !!raw && n === null);
    }
    if (!cur.tree) return showRes(cur.err, 'hint');
    if (invalid.length) return showRes('Valor no válido en ' + invalid.map(showExpr).join(', '), 'err');
    if (missing.length) return showRes('Falta valor de ' + missing.map(showExpr).join(', '), 'hint');
    try {
      eqValue = evaluateEquation(cur.tree, env);
      showRes(fmt(eqValue), '');
    } catch (err) { showRes(err.message, 'err'); }
  }

  // Tokens de la calculadora después de los cuales no hace falta añadir un operador
  const CALC_OPERATOR_TOKENS = new Set(['NEG', '+', '-', '*', '/', '^', 'xroot', 'nCr', 'nPr', '(', ',', 'EXP']);

  // Tokens de la calculadora para escribir un número: dígitos, punto, signo (NEG) y exponente (EXP)
  function valueTokens(v) {
    const [mant, exp] = fmt(Math.abs(v)).split('E');
    const out = v < 0 ? ['NEG'] : [];
    out.push(...mant.split(''));
    if (exp !== undefined) {
      out.push('EXP');
      if (exp.startsWith('-')) out.push('NEG');
      out.push(...exp.replace(/^[+-]/, '').split(''));
    }
    return out;
  }

  // Pasa el valor a la calculadora escribiéndolo en la posición del cursor, sin borrar lo que ya hay
  function sendToCalc(v) {
    lastAns = v;
    error = '';
    if (justEval) { cursor = tokens.length; justEval = false; }
    const before = tokens[cursor - 1];
    const num = valueTokens(v);
    // Si justo antes hay un valor (p. ej. "8"), se suma por defecto; si ya hay operador ("8-", "8*", "8/"), se usa ese
    const add = before !== undefined && !CALC_OPERATOR_TOKENS.has(before) ? ['+', ...num] : num;
    tokens.splice(cursor, 0, ...add);
    cursor += add.length;
    result = '';
    justEval = false;
  }

  // Calcular: muestra el resultado y lo pasa a la calculadora normal
  function calcAndSend() {
    recalc();
    if (eqValue === null) return;
    addHistory(showExpr(eq.expr), fmt(eqValue));
    sendToCalc(eqValue);
    setView('calc');
    render();
  }

  // ---------- Edición de la expresión (cursor) ----------
  function insertEq(text) {
    if (!eq.editing) return;
    eq.expr = eq.expr.slice(0, eq.cursor) + text + eq.expr.slice(eq.cursor);
    eq.cursor += text.length;
    setMsg('');
    renderEditor();
  }

  // Subíndice: solo justo después de una letra (A → A_1, que cuenta como una sola variable)
  function insertSub() {
    if (!eq.editing) return;
    if (!/[A-Za-zπ]$/.test(eq.expr.slice(0, eq.cursor))) {
      setMsg('El subíndice va justo después de una letra: escribe la letra y luego pulsa x₁.');
      return;
    }
    insertEq('_');
  }

  function deleteEq() {
    if (!eq.editing || eq.cursor === 0) return;
    const before = eq.expr.slice(0, eq.cursor);
    // Borra un token entero (p. ej. "sin(", " nCr " o "^2") en lugar de un carácter suelto
    const tok = DEL_TOKENS.find(w => before.endsWith(w));
    const len = tok ? tok.length : 1;
    eq.expr = before.slice(0, -len) + eq.expr.slice(eq.cursor);
    eq.cursor -= len;
    renderEditor();
  }

  function moveCursor(d) {
    if (!eq.editing) return;
    eq.cursor = Math.min(eq.expr.length, Math.max(0, eq.cursor + d));
    renderEditor();
  }

  function clearExpr() {
    if (!eq.editing) return;
    eq.expr = '';
    eq.cursor = 0;
    renderEditor();
  }

  // ---------- Teclado virtual: la misma disposición que la calculadora ----------
  // ALPHA: minúsculas · ABC/123: letras o números · SHIFT: funciones secundarias
  let shiftOn = false;
  let kbLetters = false;

  function toggleShift() { shiftOn = !shiftOn; renderKb(); }
  function toggleLetters() { kbLetters = !kbLetters; renderKb(); }
  function toggleCase() { kbLower = !kbLower; renderKb(); }

  function kbLetterRows() {
    return EQ_LETTERS.map(row => [...row].map(L => {
      const ch = kbLower ? L.toLowerCase() : L;
      return { l: ch, t: ch };
    }));
  }

  function kbBlocks() {
    const blocks = [
      { cls: 'kb-top', rows: [[
        { l: 'SHIFT', act: toggleShift, on: shiftOn },
        { l: 'ALPHA', act: toggleCase, on: kbLower },
        { l: '◄', act: () => moveCursor(-1) },
        { l: '►', act: () => moveCursor(1) },
        { l: 'x₁', act: insertSub },   // subíndice (en lugar de MODE, que aquí no se usa)
        { l: 'ON', act: clearExpr }
      ]] },
      { cls: 'kb-fn', rows: [
        [{ l: 'x⁻¹', t: '^(-1)', sl: 'x!', st: '!' }, { l: 'nCr', t: ' nCr ', sl: 'nPr', st: ' nPr ' },
          { l: 'Pol(', dis: true, sl: 'Rec(', sdis: true }, { l: '³√', t: 'cbrt(' }, { l: 'x³', t: '^3' },
          { l: 'xʸ', t: '^', sl: 'ˣ√', sdis: true }],
        [{ l: 'ENG', dis: true }, { l: 'a b/c', dis: true }, { l: '√', t: 'sqrt(' }, { l: 'x²', t: '^2' },
          { l: 'log', t: 'log(', sl: '10ˣ', st: 'pow10(' }, { l: 'ln', t: 'ln(', sl: 'eˣ', st: 'exp(' }],
        [{ l: '(−)', t: '-' }, { l: '°′″', dis: true }, { l: 'hyp', dis: true },
          { l: 'sin', t: 'sin(', sl: 'sin⁻¹', st: 'asin(' }, { l: 'cos', t: 'cos(', sl: 'cos⁻¹', st: 'acos(' },
          { l: 'tan', t: 'tan(', sl: 'tan⁻¹', st: 'atan(' }],
        [{ l: 'STO', dis: true }, { l: 'RCL', dis: true }, { l: '(', t: '(' }, { l: ')', t: ')' },
          { l: ',', t: ',' }, { l: 'M+', dis: true }]
      ] }
    ];
    if (kbLetters) {
      blocks.push({ cls: 'kb-letters', rows: kbLetterRows() });
      blocks.push({ cls: 'kb-ops10', rows: [[
        { l: '123', act: toggleLetters }, { l: 'DEL', act: deleteEq }, { l: 'AC', act: clearExpr },
        { l: '.', t: '.' }, { l: 'π', t: 'π' }, { l: '×', t: '*' }, { l: '÷', t: '/' },
        { l: '+', t: '+' }, { l: '−', t: '-' }, { l: '=', act: calcAndSend }
      ]] });
    } else {
      blocks.push({ cls: 'kb-pad', rows: [
        [{ l: '7', t: '7' }, { l: '8', t: '8' }, { l: '9', t: '9' }, { l: 'DEL', act: deleteEq }, { l: 'AC', act: clearExpr }],
        [{ l: '4', t: '4' }, { l: '5', t: '5' }, { l: '6', t: '6' }, { l: '×', t: '*' }, { l: '÷', t: '/' }],
        [{ l: '1', t: '1' }, { l: '2', t: '2' }, { l: '3', t: '3' }, { l: '+', t: '+' }, { l: '−', t: '-' }],
        [{ l: '0', t: '0' }, { l: '.', t: '.' }, { l: 'EXP', dis: true, sl: 'π', st: 'π' },
          { l: 'ABC', act: toggleLetters }, { l: '=', act: calcAndSend }]
      ] });
    }
    return blocks;
  }

  // Con SHIFT activo, las teclas con función secundaria muestran y escriben esa función
  function kbKeyEl(k) {
    const sh = shiftOn && k.sl !== undefined;
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = sh ? k.sl : k.l;
    b.disabled = sh ? !!k.sdis : !!k.dis;
    if (k.on) b.className = 'on';
    b.addEventListener('click', () => kbPress(k, sh));
    return b;
  }

  function kbPress(k, sh) {
    if (k.act === toggleShift) return toggleShift();
    shiftOn = false;
    if (sh) insertEq(k.st);
    else if (k.act) k.act();
    else insertEq(k.t);
    renderKb();
  }

  function renderKb() {
    const kb = $('eqKb');
    kb.textContent = '';
    for (const block of kbBlocks()) {
      for (const row of block.rows) {
        const r = document.createElement('div');
        r.className = block.cls;
        row.forEach(k => r.append(kbKeyEl(k)));
        kb.append(r);
      }
    }
  }

  // ---------- Historial: máximo 10 cálculos; al entrar uno nuevo se elimina el más antiguo ----------
  const HIST_KEY = 'calc.history.v1';
  const HIST_MAX = 10;
  let calcHistory = (() => {
    try {
      const d = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
      return Array.isArray(d) ? d.filter(x => x && typeof x.e === 'string' && typeof x.r === 'string').slice(0, HIST_MAX) : [];
    } catch (err) { return []; }
  })();

  function addHistory(expr, res) {
    calcHistory = [{ e: expr, r: res }, ...calcHistory].slice(0, HIST_MAX);
    try { localStorage.setItem(HIST_KEY, JSON.stringify(calcHistory)); }
    catch (err) { /* sin almacenamiento el historial sigue en memoria */ }
    renderHistory();
  }

  function renderHistory() {
    const box = $('hist');
    box.textContent = '';
    if (!calcHistory.length) {
      const m = document.createElement('div');
      m.className = 'hist-empty';
      m.textContent = 'Sin cálculos todavía.';
      box.append(m);
      return;
    }
    for (const h of calcHistory) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'hist-item';
      b.dataset.res = h.r;
      const e = document.createElement('small');
      e.textContent = h.e;
      const r = document.createElement('span');
      r.textContent = h.r;
      b.append(e, r);
      box.append(b);
    }
  }

  // Tocar un cálculo lo usa como valor en la calculadora (sin borrar lo que haya)
  $('hist').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    sendToCalc(Number(b.dataset.res));
    render();
  });
  $('histClear').addEventListener('click', () => {
    calcHistory = [];
    try { localStorage.removeItem(HIST_KEY); } catch (err) { /* nada que limpiar */ }
    renderHistory();
  });

  // ---------- Eventos ----------
  document.querySelector('.tabs').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) setView(b.dataset.view);
  });
  $('eqSearch').addEventListener('input', renderList);
  $('eqNew').addEventListener('click', newEq);
  $('eqList').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.action === 'new') newEq();
    else if (b.dataset.id) openEq(b.dataset.id);
  });
  $('eqBack').addEventListener('click', backToList);
  $('eqName').addEventListener('input', e => { eq.name = e.target.value; });
  $('eqEdit').addEventListener('click', startEdit);
  $('eqSave').addEventListener('click', saveEq);
  $('eqCancel').addEventListener('click', cancelEdit);
  $('eqDup').addEventListener('click', duplicateEq);
  $('eqDel').addEventListener('click', removeEq);
  $('eqCalc').addEventListener('click', calcAndSend);
  $('eqVars').addEventListener('input', e => {
    const v = e.target.dataset.v;
    if (!v) return;
    eq.values[v] = e.target.value;   // cambia solo esta variable; la expresión no se toca
    recalc();
  });

  // Teclado físico: la letra se inserta tal como se escribe
  window.addEventListener('keydown', e => {
    if (view !== 'eq' || !eq.editing || e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'Backspace') { e.preventDefault(); deleteEq(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); moveCursor(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); moveCursor(1); }
    else if (e.key === '_') { e.preventDefault(); insertSub(); }
    else if (e.key.length === 1 && EQ_CHAR_RE.test(e.key)) { e.preventDefault(); insertEq(e.key); }
  });


  // ---------- NOTAS: promedio ponderado (con subnotas) ----------
  // Una fila puede tener subnotas (r.subs): su ponderación es un % de esa fila y deben sumar 100.
  const GR_KEY = 'calc.grades.v1';
  let gr = { min: '1', max: '7', target: '4', rows: [{ n: '', w: '' }] };
  try {
    const raw = JSON.parse(localStorage.getItem(GR_KEY));
    if (raw && Array.isArray(raw.rows) && raw.rows.length) {
      const cell = r => ({ n: String(r.n ?? ''), w: String(r.w ?? '') });
      gr = {
        min: String(raw.min ?? '1'), max: String(raw.max ?? '7'), target: String(raw.target ?? ''),
        rows: raw.rows.map(r => {
          const o = cell(r);
          if (Array.isArray(r.subs) && r.subs.length) o.subs = r.subs.map(cell);
          return o;
        })
      };
    }
  } catch (e) { /* sin almacenamiento */ }
  const grSave = () => { try { localStorage.setItem(GR_KEY, JSON.stringify(gr)); } catch (e) { /* ignorar */ } };

  // '' → null (vacío), texto no numérico → NaN
  function grNum(t) {
    const s = String(t).trim().replace(',', '.');
    if (s === '') return null;
    return /^(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : NaN;
  }
  const grFmt = x => String(parseFloat(x.toFixed(4)));
  const grRound = x => Math.round(x * 1e6) / 1e6;
  // Redondeo escolar (mitad hacia arriba) limpiando el ruido de punto flotante: 3.95 → 4.0 con 1 decimal
  const roundTo = (x, d) => Math.round(Number((x * Math.pow(10, d)).toPrecision(12))) / Math.pow(10, d);
  const geq = (a, b) => a >= b - 1e-9;
  // Ajustes de aproximación (se editan en AJUSTES)
  const approx = { on: true, dec: 1 };
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const grInput = (i, j, f, v, ph, dis) =>
    '<input data-i="' + i + '"' + (j === null ? '' : ' data-j="' + j + '"') + ' data-f="' + f + '" type="text" inputmode="decimal"' +
    ' autocomplete="off" placeholder="' + ph + '" value="' + esc(v) + '"' + (dis ? ' disabled' : '') + '>';

  function grRowsHtml() {
    $('grRows').innerHTML = gr.rows.map((r, i) => {
      const subs = r.subs;
      let h = '<div class="gr-row">' + grInput(i, null, 'n', subs ? '' : r.n, subs ? 'prom.' : '?', !!subs) +
        grInput(i, null, 'w', r.w, '%') +
        (subs ? '<span></span>' : '<button type="button" data-sub="' + i + '" aria-label="Agregar subnotas" title="Subnotas">+▾</button>') +
        '<button type="button" data-del="' + i + '" aria-label="Quitar">✕</button></div>';
      if (subs) {
        h += '<div class="gr-subs"><div class="gr-cols"><span>Subnotas de la fila ' + (i + 1) + '</span><span>% de esta fila</span><span></span></div>' +
          subs.map((x, j) => '<div class="gr-sub-row">' + grInput(i, j, 'n', x.n, '?') + grInput(i, j, 'w', x.w, '%') +
            '<button type="button" data-delsub="' + i + ':' + j + '" aria-label="Quitar subnota">✕</button></div>').join('') +
          '<div class="actions"><button type="button" data-addsub="' + i + '">+ Subnota</button>' +
          '<button type="button" data-fillsub="' + i + '">+ Subnota que falta</button>' +
          '<button type="button" data-splitsub="' + i + '" style="grid-column: 1 / -1">Repartir lo que falta equitativamente</button></div></div>';
      }
      return h;
    }).join('');
  }

  // Calcula y pinta el resultado sin recrear los campos (para no perder el foco)
  function grUpdate() {
    const min = grNum(gr.min), max = grNum(gr.max), target = grNum(gr.target);
    const errs = [];
    $('grRows').querySelectorAll('input').forEach(el => el.classList.remove('bad'));

    const setBad = (id, on) => $(id).classList.toggle('bad', on);
    const rangeOk = min !== null && max !== null && !Number.isNaN(min) && !Number.isNaN(max) && min < max;

    // Revisa una nota y su ponderación; devuelve { n, w } o null si hay error
    const cellOf = (c, i, j, label, wRowMax) => {

      if (Number.isNaN(w)) { bad(i, j, 'w', label + ': ponderación no válida.'); return null; }
      if (Number.isNaN(n)) { bad(i, j, 'n', label + ': nota no válida.'); return null; }
      if (w !== null && w > wRowMax) { bad(i, j, 'w', label + ': la ponderación no puede superar ' + wRowMax + '%.'); return null; }
      if (n !== null && rangeOk && (n < min || n > max)) {
        bad(i, j, 'n', label + ': la nota debe estar entre ' + grFmt(min) + ' y ' + grFmt(max) + '.');
        return null;
      }
      if (w === null && n !== null) { bad(i, j, 'w', label + ': falta la ponderación.'); return null; }
      return { n, w };
    };

    const dtxt = dec === 1 ? '1 decimal' : dec + ' decimales';
    // Con la aproximación activa se redondea el promedio de cada fila con subnotas y la nota final
    const rnd = x => dec === null ? x : roundTo(x, dec);
    const show = x => grFmt(rnd(x));

    let sumW = 0, known = 0, knownW = 0, unW = 0;
    const unknown = [];
    const model = [];   // filas válidas: { w, n } o { w, subs: [{ n, w }] }; n === null es la nota que falta
    const leaf = (label, n, w) => {
      if (n === null) { unknown.push({ label, w }); unW += w; }
      else { known += n * w / 100; knownW += w; }
    };
    gr.rows.forEach((r, i) => {
      const lab = 'Fila ' + (i + 1);
      const c = cellOf(r.subs ? { n: '', w: r.w } : r, i, null, lab, 100);
      if (!c) return;
      if (c.w === null) { if (r.subs) errs.push(lab + ': falta la ponderación de la fila con subnotas.'); return; }
      sumW += c.w;
      if (!r.subs) { model.push({ w: c.w, n: c.n }); leaf('la nota de la fila ' + (i + 1), c.n, c.w); return; }
      const m = { w: c.w, subs: [] };
      model.push(m);
      let sumS = 0, allKnown = true, avg = 0, ok = true;
      r.subs.forEach((x, j) => {
        const sc = cellOf(x, i, j, lab + ', subnota ' + (j + 1), 100);
        if (!sc) { ok = false; return; }
        if (sc.w === null) { allKnown = false; return; }
        sumS += sc.w;
        m.subs.push({ n: sc.n, w: sc.w });
        if (sc.n === null) allKnown = false; else avg += sc.n * sc.w / 100;
        leaf('la subnota ' + (j + 1) + ' de la fila ' + (i + 1), sc.n, c.w * sc.w / 100);

      if (sumS !== 100 && ok) {

      const shown = field(i, null, 'n');
      if (shown) shown.value = (allKnown && ok && sumS === 100) ? show(avg) : '';

    const finalWith = (x, rounded) => {
      let sum = 0;
      model.forEach(m => {

    else if (sumW < 100) errs.push('Las ponderaciones suman ' + grFmt(sumW) + '%: faltan ' + grFmt(100 - sumW) + '% para llegar a 100%.');

  function grSplit(list) {
    const empty = list.filter(c => grNum(c.w) === null);
    const rest = grRest(list);
    if (!empty.length || rest <= 0) return;
    const each = Number((rest / empty.length).toFixed(4));

      const near = tab.get([...nearO, ni]);
      const betw = [...between, bp.i0 === bp.i1 ? '' : 'p entre ' + fmtT(pAx[bp.i0]) + ' y ' + fmtT(pAx[bp.i1])].filter(Boolean);
      const out = { expr: tab.val + ' (' + glTxt + ', p=' + fmtT(last) + ')', lines: [] };
      if (exact) { out.main = fmtT(v); out.lines.push('Valor de la tabla: ' + fmtT(v)); }
      else {
        out.main = fmtI(v);
        out.lines.push('Interpolado: ' + fmtI(v) + ' (' + betw.join('; ') + ')');
        out.lines.push('Más cercano en la tabla: ' + fmtT(near) + ' (' + nearLabel + ', p=' + fmtT(pAx[ni]) + ')');
      }
      return out;
    }

    // modo 1: valores a lo largo de p (con los otros ejes interpolados), de mayor a menor
    const along = br => pAx.map((_, k) => tbMlin(idx => tab.get([...idx, k]), br));
    const v = along(brO);
    const lo = v[v.length - 1], hi = v[0];
    if (last > hi + 1e-9) return { err: 'Ese valor es mayor que todos los de la tabla para ' + glTxt + ' (hasta ' + fmtI(hi) + '): p queda por debajo de ' + fmtT(pAx[0]) + '.' };
    if (last < lo - 1e-9) return { err: 'Ese valor es menor que todos los de la tabla para ' + glTxt + ' (desde ' + fmtI(lo) + '): p queda por encima de ' + fmtT(pAx[pAx.length - 1]) + '.' };
    let k = 0;
    while (k < v.length - 1 && !(v[k] >= last - 1e-9 && last >= v[k + 1] - 1e-9)) k++;
    const hit = tbEq(v[k], last) ? k : (k + 1 < v.length && tbEq(v[k + 1], last) ? k + 1 : -1);
    const p = hit >= 0 ? pAx[hit] : pAx[k] + (last - v[k]) / (v[k + 1] - v[k]) * (pAx[k + 1] - pAx[k]);
    const vn = along(nearO.map(i => ({ i0: i, i1: i, w: 0 })));
    const kn = vn.reduce((b, x, i) => Math.abs(x - last) < Math.abs(vn[b] - last) - 1e-12 ? i : b, 0);
    const out = { expr: 'p (' + glTxt + ', ' + tab.val + '=' + fmtT(last) + ')', lines: [] };
    if (exactO && hit >= 0) { out.main = fmtT(pAx[hit]); out.lines.push('Valor de la tabla: p = ' + fmtT(pAx[hit])); }
    else {
      out.main = fmtI(p);
      out.lines.push('Interpolado: p = ' + fmtI(p) + ' (entre ' + fmtT(pAx[k]) + ' y ' + fmtT(pAx[Math.min(k + 1, pAx.length - 1)]) + (between.length ? '; ' + between.join('; ') : '') + ')');
      out.lines.push('Más cercano en la tabla: p = ' + fmtT(pAx[kn]) + ' (' + tab.val + '=' + fmtT(vn[kn]) + ', ' + nearLabel + ')');
    }
    return out;
  }

  // Normal estándar (cola izquierda): modo 0 = P(Z ≤ z) con z a 2 decimales; modo 1 = z dada la probabilidad
  function tbNormal(mode, raw) {
    const N = TBL.normal, x = tbNum(raw[0]);
    if (x === null) return { hint: 'Completa todos los campos.' };
    if (Number.isNaN(x)) return { err: 'Hay un valor que no es un número.' };
    if (mode === 0) {
      const zr = Math.sign(x) * roundTo(Math.abs(x), 2);   // 5 para arriba (alejándose de 0)
      const idx = Math.round(zr * 100);
      const out = { expr: 'P(Z ≤ ' + fmtT(zr) + ')', lines: [] };
      if (zr !== x) out.lines.push('z redondeado a 2 decimales: ' + fmtT(x) + ' → ' + fmtT(zr));
      if (Math.abs(idx) > 349) {
        out.main = idx < 0 ? '≈ 0' : '≈ 1';
        out.lines.push('Fuera de la tabla (|z| > 3.49): la probabilidad tiende a ' + (idx < 0 ? '0' : '1') + '.');
        return out;
      }
      out.main = fmtT(N[idx + 349]);
      out.lines.push('P(Z ≤ ' + fmtT(zr) + ') = ' + fmtT(N[idx + 349]));
      return out;
    }
    if (x <= 0 || x >= 1) return { err: 'La probabilidad debe estar entre 0 y 1.' };
    const lo = N[0], hi = N[N.length - 1];
    if (x < lo - 1e-9) return { err: 'Fuera de la tabla: P < ' + fmtT(lo) + ', z queda por debajo de −3.49 (tiende a −∞).' };
    if (x > hi + 1e-9) return { err: 'Fuera de la tabla: P > ' + fmtT(hi) + ', z queda por encima de 3.49 (tiende a +∞).' };
    const zOf = i => (i - 349) / 100;
    const out = { expr: 'P(Z ≤ z) = ' + fmtT(x), lines: [] };
    const same = N.map((v, i) => tbEq(v, x) ? i : -1).filter(i => i >= 0);
    if (same.length) {
      const a = zOf(same[0]), b = zOf(same[same.length - 1]);
      if (a === b) { out.main = fmtT(a); out.lines.push('Valor de la tabla: z = ' + fmtT(a)); }
      else {
        out.main = fmtI((a + b) / 2);
        out.lines.push('Ese valor se repite en la tabla entre z = ' + fmtT(a) + ' y z = ' + fmtT(b) + '; se muestra el punto medio.');
      }
      return out;
    }
    let i = 0;
    while (!(N[i] < x && x < N[i + 1])) i++;
    const z = (i - 349 + (x - N[i]) / (N[i + 1] - N[i])) / 100;
    let j = 0;
    N.forEach((v, q) => { if (Math.abs(v - x) < Math.abs(N[j] - x) - 1e-12 || (Math.abs(Math.abs(v - x) - Math.abs(N[j] - x)) <= 1e-12 && Math.abs(q - 349) < Math.abs(j - 349))) j = q; });
    out.main = fmtI(z);
    out.lines.push('Interpolado: z = ' + fmtI(z) + ' (entre z = ' + fmtT(zOf(i)) + ' y z = ' + fmtT(zOf(i + 1)) + ')');
    out.lines.push('Más cercano en la tabla: z = ' + fmtT(zOf(j)) + ' (P = ' + fmtT(N[j]) + ')');
    return out;
  }

  const tb = { sel: 'normal', mode: 0, raw: {} };
  const tbFields = () => {
    if (tb.sel === 'normal') return [tb.mode === 0 ? 'z' : 'Probabilidad P(Z ≤ z)'];
    const t = TB_TABS[tb.sel], gl = t.names.slice(0, -1);
    return [...gl, tb.mode === 0 ? 'p (cola derecha)' : 'Valor de ' + t.val];
  };
  const TB_MODES = { normal: ['P(Z ≤ z)', 'Buscar z'], t: ['Valor t', 'Buscar p'], chi: ['Valor χ²', 'Buscar p'], f: ['Valor F', 'Buscar p'] };
  const TB_TITLES = { normal: 'Tabla normal estándar (cola izquierda)', t: 'Tabla t de Student', chi: 'Tabla chi-cuadrada', f: 'Tabla F de Fisher' };
  const tbKey = () => tb.sel + tb.mode;

  function tbCompute() {
    const raw = tb.raw[tbKey()] || [];
    const labels = tbFields();
    const r = tb.sel === 'normal' ? tbNormal(tb.mode, raw) : tbTable(TB_TABS[tb.sel], tb.mode, labels.map((_, i) => raw[i] || ''));
    $('tbInd').textContent = TB_TITLES[tb.sel];
    $('tbExpr').textContent = r.expr || '';
    $('tbRes').textContent = r.main || '';
    $('tbRes').className = 'res';
    $('tbInfo').innerHTML = (r.err ? '<div class="err">' + esc(r.err) + '</div>' : '') +
      (r.hint ? '<div>' + esc(r.hint) + '</div>' : '') + (r.lines || []).map(t => '<div>' + esc(t) + '</div>').join('');
    $('tbIn').querySelectorAll('input').forEach(el => {
      const v = tbNum(el.value);
      el.classList.toggle('bad', Number.isNaN(v));
    });
  }

  function tbRender() {
    document.querySelectorAll('#tbSel button').forEach(b => b.classList.toggle('on', b.dataset.tb === tb.sel));
    document.querySelectorAll('#tbMode button').forEach(b => {
      b.textContent = TB_MODES[tb.sel][+b.dataset.mode];
      b.classList.toggle('on', +b.dataset.mode === tb.mode);
    });
    const raw = tb.raw[tbKey()] || (tb.raw[tbKey()] = []);
    $('tbIn').innerHTML = tbFields().map((l, i) =>
      '<label>' + esc(l) + '<input data-i="' + i + '" type="text" inputmode="decimal" autocomplete="off" value="' + esc(raw[i] || '') + '"></label>').join('');
    tbCompute();
  }

  $('tbSel').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { tb.sel = b.dataset.tb; tb.mode = 0; tbRender(); } });
  $('tbMode').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { tb.mode = +b.dataset.mode; tbRender(); } });
  $('tbIn').addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.i === undefined) return;
    (tb.raw[tbKey()] || (tb.raw[tbKey()] = []))[+el.dataset.i] = el.value;
    tbCompute();
  });
  tbRender();

  // ---------- AJUSTES: tema y datos ----------
  const SET_KEY = 'calc.settings.v1';
  let theme = 'auto';
  try {
    const st = JSON.parse(localStorage.getItem(SET_KEY));
    if (['auto', 'light', 'dark'].includes(st.theme)) theme = st.theme;
    if (typeof st.approxOn === 'boolean') approx.on = st.approxOn;
    if (Number.isInteger(st.approxDec) && st.approxDec >= 0 && st.approxDec <= 4) approx.dec = st.approxDec;
  } catch (e) { /* por defecto */ }
  const saveSettings = () => {
    try { localStorage.setItem(SET_KEY, JSON.stringify({ theme, approxOn: approx.on, approxDec: approx.dec })); } catch (err) { /* ignorar */ }
  };
  const darkMq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function applyTheme() {
    const dark = theme === 'dark' || (theme === 'auto' && darkMq && darkMq.matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    let m = document.querySelector('meta[name="theme-color"]');
    if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
    m.content = dark ? '#161618' : '#e6e6e6';
    document.querySelectorAll('#setTheme button').forEach(b => b.classList.toggle('on', b.dataset.theme === theme));
  }
  if (darkMq && darkMq.addEventListener) darkMq.addEventListener('change', applyTheme);
  $('setTheme').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    theme = b.dataset.theme;
    saveSettings();
    applyTheme();
  });
  function renderApprox() {
    $('setApprox').textContent = 'Aproximar notas: ' + (approx.on ? 'activado' : 'desactivado');
    $('setApprox').classList.toggle('on', approx.on);
    $('setDec').disabled = !approx.on;
    if (document.activeElement !== $('setDec')) $('setDec').value = String(approx.dec);
  }
  $('setApprox').addEventListener('click', () => { approx.on = !approx.on; saveSettings(); renderApprox(); grUpdate(); });
  $('setDec').addEventListener('input', e => {
    const v = e.target.value.trim();
    const ok = /^[0-4]$/.test(v);
    e.target.classList.toggle('bad', !ok);
    if (!ok) return;
    approx.dec = +v; saveSettings(); grUpdate();
  });
  $('setDec').addEventListener('blur', () => { $('setDec').classList.remove('bad'); renderApprox(); });
  renderApprox();
  const setNote = t => { $('setNote').textContent = t; };
  $('setHist').addEventListener('click', () => {
    if (!confirm('¿Borrar el historial de cálculos?')) return;
    $('histClear').click(); setNote('Historial borrado.');
  });
  $('setGr').addEventListener('click', () => {
    if (!confirm('¿Limpiar las notas y ponderaciones?')) return;
    gr.rows = [{ n: '', w: '' }]; grSave(); grRender(); setNote('Notas limpiadas.');
  });
  $('setEq').addEventListener('click', () => {
    if (!confirm('¿Borrar todas las ecuaciones guardadas? No se puede deshacer.')) return;
    equations = []; persist(); showList(); setNote('Ecuaciones borradas.');
  });
  applyTheme();

  // Fórmulas de ejemplo (una sola vez; se pueden borrar o editar)
  const SEED_KEY = 'calc.seed.v1';
  try {
    if (!localStorage.getItem(SEED_KEY)) {
      const now = Date.now();
      [['Desviación estándar combinada (sp)', 'sqrt((s_1^2*(n_1-1)+s_2^2*(n_2-1))/(n_1+n_2-2))'],
       ['Grados de libertad de Welch (ν)', '(s_1^2/n_1+s_2^2/n_2)^2/((s_1^2/n_1)^2/(n_1-1)+(s_2^2/n_2)^2/(n_2-1))'],
       ['IC de μ1 − μ2: límite inferior', 'x_1-x_2-t*sqrt(s_1^2/n_1+s_2^2/n_2)'],
       ['IC de μ1 − μ2: límite superior', 'x_1-x_2+t*sqrt(s_1^2/n_1+s_2^2/n_2)']
      ].forEach(([name, expr], k) => {
        if (!equations.some(x => sameName(x.name, name))) equations.push({ id: newId(), name, expr, createdAt: now + k, updatedAt: now + k });
      });
      persist();
      localStorage.setItem(SEED_KEY, '1');
    }
  } catch (err) { /* sin almacenamiento no se agregan */ }

  grRender();
  showList();
  setView('calc');

  renderHistory();
  render();
})();
</script>
</body>
